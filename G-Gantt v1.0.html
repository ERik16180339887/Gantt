    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Lock Table Layout */
        .gantt-table {
            table-layout: fixed;
            width: max-content;
            border-collapse: separate;
            border-spacing: 0;
        }

        /* Fixed Left Column positioning */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        .sticky-col-header {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 50 !important;
            background-color: #f1f5f9 !important;
        }

        /* Resizable Handle */
        .resizer-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            z-index: 55;
        }
        .resizer-handle:hover, .resizer-handle.resizing {
            background-color: #6366f1;
        }

        .timeline-resizer-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            z-index: 35;
        }
        .timeline-resizer-handle:hover, .timeline-resizer-handle.resizing {
            background-color: #6366f1;
        }

        /* Grid Background Container Overlay */
        .gantt-grid-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Grid lines */
        .day-grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px dotted #cbd5e1;
            pointer-events: none;
        }
        .week-grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px solid #cbd5e1;
            pointer-events: none;
            z-index: 2;
        }
        .month-grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px solid #94a3b8;
            pointer-events: none;
            z-index: 2;
        }

        /* Today Dotted Line & Highlight Area */
        .today-dotted-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 2px dotted #ef4444;
            pointer-events: none;
            z-index: 12;
        }
        .today-column-bg {
            position: absolute;
            top: 0;
            bottom: 0;
            background-color: rgba(239, 68, 68, 0.08);
            pointer-events: none;
            z-index: 1;
        }

        /* Baseline Bar (Pianificazione Originaria) */
        .baseline-bar {
            position: absolute;
            height: 4px;
            bottom: 1px;
            background-color: #cbd5e1;
            border-radius: 2px;
            pointer-events: none;
            z-index: 8;
        }
        .baseline-bar-parent {
            position: absolute;
            height: 4px;
            bottom: 2px;
            background-color: #94a3b8;
            border-radius: 2px;
            pointer-events: none;
            z-index: 8;
        }

        body.view-mode .action-buttons {
            display: none !important;
        }

        @media print {
            header, .action-bar, .action-buttons, #toggleEditModeBtn, #addParentBtn, #searchInput, #toggleViewModeBtn {
                display: none !important;
            }
        }
    </style>
</head>

    <!-- TOP HEADER / TOOLBAR PRINCIPALE -->

                        <rect x="25.785757" y="25.785757" width="34.178341" height="12.428487" rx="6.2142434" fill="#c7d2fe" id="rect3" style="stroke-width:1.55356" />

            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">G-Gantt</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded border border-indigo-200">v1.0</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">Pianificazione e condivisione file singolo (Licenza GNU GPLv3)</p>
            </div>
        </div>

        <!-- GLOBAL UTILITY ACTIONS -->
        <div class="flex items-center flex-wrap gap-3">
            <button id="exportHtmlBtn" class="bg-green-500 hover:bg-green-700 text-white font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors" title="Genera un singolo file HTML con nome personalizzato">
                <i data-lucide="file-code" class="w-4 h-4"></i>
                <span class="hidden md:inline">Esporta HTML Unico</span>
            </button>

            <button id="exportBtn" class="bg-slate-200 hover:bg-slate-400 text-slate-700 font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Esporta Dati JSON">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Salva</span>
            </button>

            <label class="bg-slate-200 hover:bg-slate-400 text-slate-700 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors cursor-pointer" title="Importa Dati JSON">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Importa</span>
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>

            <button id="clearBtn" class="bg-red-400 hover:bg-red-700 text-white hover:text-yellow-300 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Elimina Tutto">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button id="resetBtn" class="bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Ripristina dati di partenza">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- ACTION SUB-BAR -->
    <div class="action-bar bg-white border-b border-slate-200 px-6 py-2.5 flex flex-wrap items-center justify-start gap-3 shadow-sm shrink-0 z-40">
        <div class="relative w-48 lg:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Cerca attività..."
                class="pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full transition-all bg-white">
        </div>

        <button id="addParentBtn" onclick="addNewParentTask()" class="bg-indigo-600 hover:bg-cyan-400 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors" title="Aggiungi nuovo gruppo principale">
            <i data-lucide="folder-plus" class="w-4 h-4"></i>
            <span>Nuovo Gruppo</span>
        </button>

        <button id="toggleEditModeBtn" onclick="toggleEditMode()" class="bg-orange-300 hover:bg-lime-300 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Attiva/Disattiva Modalità Modifica">
            <i data-lucide="pencil" id="toggleEditIcon" class="w-4 h-4 text-amber-600"></i>
            <span id="toggleEditText">Modalità Modifica</span>
        </button>
		
        <!-- Undo / Redo -->
        <div class="flex items-center space-x-1 border-l border-slate-200 pl-3">
            <button id="undoBtn" onclick="performUndo()" disabled class="bg-slate-100 hover:bg-slate-200 text-slate-400 hover:text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="Annulla (Ctrl+Z)">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button id="redoBtn" onclick="performRedo()" disabled class="bg-slate-100 hover:bg-slate-200 text-slate-400 hover:text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="Ripristina (Ctrl+Y)">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>
        </div>

        <button id="toggleViewModeBtn" onclick="toggleTimelineView()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 transition-colors ml-auto" title="Cambia Zoom Timeline">
            <i data-lucide="calendar" class="w-4 h-4 text-indigo-600"></i>
            <span id="toggleViewText">Vista: Settimanale</span>
        </button>
    </div>

    <!-- MAIN GANTT CONTAINER -->
    <main class="flex-1 p-4 md:p-6 overflow-hidden flex flex-col">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative">
            
            <!-- STICKY HEADER CONTAINER -->
            <div id="stickyHeaderContainer" class="shrink-0 z-30 bg-slate-100 border-b border-slate-200 overflow-hidden">
                <table class="gantt-table border-collapse text-left">
                    <thead>
                        <tr id="ganttHeaderRow" class="text-xs text-slate-600 font-semibold"></tr>
                    </thead>
                </table>
            </div>

            <!-- SCROLLABLE BODY CONTAINER -->
            <div id="ganttScrollContainer" class="flex-1 overflow-auto relative">
                <div id="ganttGridBackground" class="gantt-grid-overlay"></div>
                <table id="ganttTable" class="gantt-table border-collapse text-left relative z-10">
                    <tbody id="ganttBody" class="text-sm"></tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- CUSTOM EDIT TASK MODAL -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                <h3 id="modalTitle" class="font-semibold text-slate-800 text-base">Modifica Attività</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="editForm" class="p-5 space-y-4 overflow-y-auto">
                <input type="hidden" id="editTaskId">
                <input type="hidden" id="editTaskLevel">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nome Attività</label>
                    <input type="text" id="editTaskTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div id="dateInputsGroup" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Inizio</label>
                        <input type="date" id="editStartDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Fine</label>
                        <input type="date" id="editEndDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div id="slipDaysGroup" class="grid grid-cols-2 gap-3 p-2.5 bg-red-50/60 rounded-xl border border-red-100">
                    <div>
                        <label class="block text-xs font-semibold text-red-700 uppercase tracking-wider mb-1">Slittamento Iniziale (g)</label>
                        <input type="number" id="editSlipDays" min="0" max="90" value="0" class="w-full px-3 py-1.5 border border-red-200 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-red-700 uppercase tracking-wider mb-1">Causa Slittamento</label>
                        <input type="text" id="editSlipReason" placeholder="Es. Permessi in attesa..." class="w-full px-3 py-1.5 border border-red-200 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
                    </div>
                </div>

                <div id="delayDaysGroup" class="grid grid-cols-2 gap-3 p-2.5 bg-amber-50/60 rounded-xl border border-amber-100">
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 uppercase tracking-wider mb-1">Ritardo Finale Extra (g)</label>
                        <input type="number" id="editDelayDays" min="0" max="90" value="0" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 uppercase tracking-wider mb-1">Causa Ritardo</label>
                        <input type="text" id="editDelayReason" placeholder="Es. Attesa materiale..." class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                </div>

                <div id="progressInputGroup">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Avanzamento (%): <span id="progressValue" class="text-indigo-600 font-bold">0%</span></label>
                    </div>
                    <input type="range" id="editProgress" min="0" max="100" step="5" class="w-full accent-indigo-600 cursor-pointer">
                </div>

                <div id="colorPickerGroup" class="space-y-3 pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Colore Gruppo Genitore</label>

                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="setPresetColor('#4f46e5')" class="w-7 h-7 rounded-full bg-indigo-600 border-2 border-white ring-2 ring-transparent hover:ring-indigo-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#059669')" class="w-7 h-7 rounded-full bg-emerald-600 border-2 border-white ring-2 ring-transparent hover:ring-emerald-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#d97706')" class="w-7 h-7 rounded-full bg-amber-600 border-2 border-white ring-2 ring-transparent hover:ring-amber-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#dc2626')" class="w-7 h-7 rounded-full bg-red-600 border-2 border-white ring-2 ring-transparent hover:ring-red-300 transition-all"></button>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        let ganttData = [];
        let currentProjectName = "Progetto Prova";
        let currentProjectId = "proj_default_v1";
        let weeksHeader = [];
        let selectedTaskId = null;
        let selectedTaskLevel = null;
        let projectStartDate = null;
        let projectEndDate = null;
        let pendingDeleteId = null;
        let pendingDeleteLevel = null;
        let searchQuery = "";
        let isEditMode = localStorage.getItem('gantt_edit_mode') === 'true';
        let timelineViewMode = localStorage.getItem('gantt_timeline_view') || 'week';

        let leftColWidth = parseInt(localStorage.getItem('gantt_left_col_width_v1'), 10) || 600;

        let dayWidthWeek = parseFloat(localStorage.getItem('gantt_day_width_week')) || 22;
        let dayWidthMonth = parseFloat(localStorage.getItem('gantt_day_width_month')) || 6;
        let dayWidth = (timelineViewMode === 'week') ? dayWidthWeek : dayWidthMonth;

        // --- GESTIONE UNDO / REDO ---
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 30;

        const WEEK_DAYS = 7;

        window.addEventListener('DOMContentLoaded', () => {
            loadGanttData();
            setupEventListeners();
            setupColumnResizer();
            setupTimelineResizer();
            setupScrollSync();
            applyEditModeUI();
            applyViewModeUI();
            lucide.createIcons();
            renderGantt();
        });
        
        function sanitizeInput(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
        }

        function validateAndSanitizeData(dataArray) {
            if (!Array.isArray(dataArray)) return false;

            for (const parent of dataArray) {
                if (typeof parent !== 'object' || parent === null) return false;
                
                if (Object.prototype.hasOwnProperty.call(parent, '__proto__') || 
                    Object.prototype.hasOwnProperty.call(parent, 'prototype')) {
                    return false;
                }
                
                parent.title = sanitizeInput(parent.title || "Gruppo senza nome");
                
                if (Array.isArray(parent.children)) {
                    for (const child of parent.children) {
                        if (typeof child !== 'object' || child === null) return false;
                        if (Object.prototype.hasOwnProperty.call(child, '__proto__') || 
                            Object.prototype.hasOwnProperty.call(child, 'prototype')) {
                            return false;
                        }
                        child.title = sanitizeInput(child.title || "Attività senza nome");
                        
                        if (Array.isArray(child.children)) {
                            for (const sub of child.children) {
                                if (typeof sub !== 'object' || sub === null) return false;
                                if (Object.prototype.hasOwnProperty.call(sub, '__proto__') || 
                                    Object.prototype.hasOwnProperty.call(sub, 'prototype')) {
                                    return false;
                                }
                                sub.title = sanitizeInput(sub.title || "Sotto-attività");
                            }
                        }
                    }
                }
            }
            return true;
        }

        function pushState() {
            const currentState = {
                projectName: currentProjectName,
                data: structuredClone(ganttData)
            };
            
            if (undoStack.length > 0 && JSON.stringify(undoStack[undoStack.length - 1]) === JSON.stringify(currentState)) {
                return;
            }

            undoStack.push(currentState);
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }
            
            redoStack = [];
            updateUndoRedoUI();
        }

        function performUndo() {
            if (undoStack.length === 0) return;

            const currentState = {
                projectName: currentProjectName,
                data: structuredClone(ganttData)
            };
            redoStack.push(currentState);

            const previousState = undoStack.pop();
            
            currentProjectName = previousState.projectName;
            ganttData = previousState.data;

            updateProjectNameUI();
            saveGanttData();
            renderGantt();
            updateUndoRedoUI();
        }

        function performRedo() {
            if (redoStack.length === 0) return;

            const currentState = {
                projectName: currentProjectName,
                data: structuredClone(ganttData)
            };
            undoStack.push(currentState);

            const nextState = redoStack.pop();
            
            currentProjectName = nextState.projectName;
            ganttData = nextState.data;

            updateProjectNameUI();
            saveGanttData();
            renderGantt();
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');

            if (undoBtn) {
                undoBtn.disabled = undoStack.length === 0;
                undoBtn.className = undoStack.length === 0 
                    ? "bg-slate-100 text-slate-300 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed"
                    : "bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors shadow-sm";
            }

            if (redoBtn) {
                redoBtn.disabled = redoStack.length === 0;
                redoBtn.className = redoStack.length === 0 
                    ? "bg-slate-100 text-slate-300 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed"
                    : "bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors shadow-sm";
            }
        }

        function loadGanttData() {
            try {
                const metaEl = document.getElementById('gantt-embedded-meta');
                if (metaEl) {
                    const parsedMeta = JSON.parse(metaEl.textContent);
                    if (parsedMeta.projectId) currentProjectId = parsedMeta.projectId;
                    if (parsedMeta.projectName) currentProjectName = parsedMeta.projectName;
                    if (Array.isArray(parsedMeta.data)) ganttData = parsedMeta.data;
                }
            } catch (e) {
                console.error("Errore lettura meta embedded:", e);
            }

            const storageKey = 'gantt_chart_data_' + currentProjectId;
            const stored = localStorage.getItem(storageKey);

            if (stored) {
                try {
                    ganttData = JSON.parse(stored);
                } catch (e) {
                    console.error("Dati localStorage non validi");
                }
            }

            const storedName = localStorage.getItem('gantt_project_name_' + currentProjectId);
            if (storedName) {
                currentProjectName = storedName;
            }

            updateProjectNameUI();
            calculateRollups();
        }

        let saveTimeout = null;

        function saveGanttData() {
            if (saveTimeout) clearTimeout(saveTimeout);

            saveTimeout = setTimeout(() => {
                localStorage.setItem('gantt_chart_data_' + currentProjectId, JSON.stringify(ganttData));
                localStorage.setItem('gantt_project_name_' + currentProjectId, currentProjectName);
                saveTimeout = null;
            }, 200);
        }

        function setupScrollSync() {
            const scrollContainer = document.getElementById('ganttScrollContainer');
            const stickyHeader = document.getElementById('stickyHeaderContainer');

            if (scrollContainer && stickyHeader) {
                scrollContainer.addEventListener('scroll', () => {
                    stickyHeader.scrollLeft = scrollContainer.scrollLeft;
                });
            }
        }

        function applyEditModeUI() {
            const btnText = document.getElementById('toggleEditText');
            const btnIcon = document.getElementById('toggleEditIcon');

            if (isEditMode) {
                document.body.classList.remove('view-mode');
                if (btnText) btnText.innerText = "Modalità Modifica";
                if (btnIcon) {
                    btnIcon.setAttribute('data-lucide', 'pencil');
                    btnIcon.className = "w-4 h-4 text-amber-600";
                }
            } else {
                document.body.classList.add('view-mode');
                if (btnText) btnText.innerText = "Modalità Vista";
                if (btnIcon) {
                    btnIcon.setAttribute('data-lucide', 'eye');
                    btnIcon.className = "w-4 h-4 text-indigo-600";
                }
            }
            lucide.createIcons();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            localStorage.setItem('gantt_edit_mode', isEditMode);
            applyEditModeUI();
        }

        function applyViewModeUI() {
            const btnText = document.getElementById('toggleViewText');
            if (btnText) {
                btnText.innerText = (timelineViewMode === 'week') ? 'Vista: Settimanale' : 'Vista: Mensile';
            }
        }

        function toggleTimelineView() {
            timelineViewMode = (timelineViewMode === 'week') ? 'month' : 'week';
            localStorage.setItem('gantt_timeline_view', timelineViewMode);

            dayWidth = (timelineViewMode === 'week') ? dayWidthWeek : dayWidthMonth;

            applyViewModeUI();
            renderGantt();
        }

        function updateProjectNameUI() {
            const disp = document.getElementById('projectNameDisplay');
            if (disp) disp.innerText = currentProjectName;
            document.title = currentProjectName;
        }

        function editProjectName() {
            showCustomPrompt("Modifica nome del Progetto", currentProjectName, (newName) => {
                currentProjectName = newName;
                updateProjectNameUI();
                saveGanttData();
            });
        }

        function getTaskDurationDays(startDateStr, endDateStr, delayDays = 0) {
            if (!startDateStr || !endDateStr) return 1;
            const start = new Date(startDateStr);
            const baseEnd = new Date(endDateStr);
            const diffTime = Math.max(0, baseEnd - start);
            const baseDays = Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
            return baseDays + (parseInt(delayDays) || 0);
        }

        function getEffectiveTaskDates(task) {
            if (!task.startDate || !task.endDate) return { start: null, end: null, baseEnd: null };
            const slip = parseInt(task.slipDays) || 0;
            const start = addDays(new Date(task.startDate), slip);
            const baseEnd = addDays(new Date(task.plannedEndDate || task.endDate), slip);
            const end = addDays(baseEnd, parseInt(task.delayDays) || 0);
            return { start, end, baseEnd };
        }

        function calculateRollups() {
            ganttData.forEach(parent => {
                if (!parent.children || parent.children.length === 0) {
                    parent.startDate = "";
                    parent.endDate = "";
                    parent.plannedEndDate = "";
                    parent.plannedStartDate = "";
                    parent.progress = 0;
                    return;
                }

                let parentMinStart = null;
                let parentMinPlannedStart = null;
                let parentMaxPlannedEnd = null;
                let parentMaxEffectiveEnd = null;
                let parentTotalWeightedProgressDays = 0;
                let parentTotalDurationDays = 0;

                parent.children.forEach(child => {
                    const origStart = child.startDate ? new Date(child.startDate) : null;
                    const origEnd = (child.plannedEndDate || child.endDate) ? new Date(child.plannedEndDate || child.endDate) : null;

                    if (origStart) {
                        if (!parentMinPlannedStart || origStart < parentMinPlannedStart) {
                            parentMinPlannedStart = origStart;
                        }
                    }
                    if (origEnd) {
                        if (!parentMaxPlannedEnd || origEnd > parentMaxPlannedEnd) {
                            parentMaxPlannedEnd = origEnd;
                        }
                    }

                    if (child.children && child.children.length > 0) {
                        let childMinStart = null;
                        let childMaxPlannedEnd = null;
                        let childMaxEffectiveEnd = null;
                        let childTotalWeightedProgressDays = 0;
                        let childTotalDurationDays = 0;

                        child.children.forEach(subchild => {
                            const dates = getEffectiveTaskDates(subchild);
                            if (dates.start) {
                                if (!childMinStart || dates.start < childMinStart) childMinStart = dates.start;
                                if (!childMaxPlannedEnd || dates.baseEnd > childMaxPlannedEnd) childMaxPlannedEnd = dates.baseEnd;
                                if (!childMaxEffectiveEnd || dates.end > childMaxEffectiveEnd) childMaxEffectiveEnd = dates.end;
                            }

                            const subDuration = getTaskDurationDays(subchild.startDate, subchild.plannedEndDate || subchild.endDate, subchild.delayDays);
                            const subProgress = parseInt(subchild.progress) || 0;

                            childTotalWeightedProgressDays += subDuration * (subProgress / 100);
                            childTotalDurationDays += subDuration;
                        });

                        child.startDate = childMinStart ? formatDateToISO(childMinStart) : "";
                        child.plannedEndDate = childMaxPlannedEnd ? formatDateToISO(childMaxPlannedEnd) : "";
                        child.endDate = childMaxEffectiveEnd ? formatDateToISO(childMaxEffectiveEnd) : "";

                        child.progress = childTotalDurationDays > 0
                            ? Math.round((childTotalWeightedProgressDays / childTotalDurationDays) * 100)
                            : 0;

                        if (childMaxPlannedEnd && childMaxEffectiveEnd) {
                            const diff = Math.round((childMaxEffectiveEnd - childMaxPlannedEnd) / (1000 * 60 * 60 * 24));
                            child.delayDays = Math.max(0, diff);
                        }
                        child.slipDays = 0;
                        child.slipReason = "";
                    }

                    const cDates = getEffectiveTaskDates(child);
                    if (cDates.start) {
                        if (!parentMinStart || cDates.start < parentMinStart) parentMinStart = cDates.start;
                        if (!parentMaxEffectiveEnd || cDates.end > parentMaxEffectiveEnd) parentMaxEffectiveEnd = cDates.end;
                    }

                    const childDuration = getTaskDurationDays(child.startDate, child.plannedEndDate || child.endDate, child.delayDays);
                    const childProgress = parseInt(child.progress) || 0;

                    parentTotalWeightedProgressDays += childDuration * (childProgress / 100);
                    parentTotalDurationDays += childDuration;
                });

                parent.startDate = parentMinStart ? formatDateToISO(parentMinStart) : "";
                parent.plannedStartDate = parentMinPlannedStart ? formatDateToISO(parentMinPlannedStart) : parent.startDate;
                parent.plannedEndDate = parentMaxPlannedEnd ? formatDateToISO(parentMaxPlannedEnd) : "";
                parent.endDate = parentMaxEffectiveEnd ? formatDateToISO(parentMaxEffectiveEnd) : "";

                parent.progress = parentTotalDurationDays > 0
                    ? Math.round((parentTotalWeightedProgressDays / parentTotalDurationDays) * 100)
                    : 0;
            });
        }

        function calculateTimelineRange() {
            let allDates = [];

            ganttData.forEach(parent => {
                if (parent.startDate) allDates.push(new Date(parent.startDate));
                if (parent.endDate) allDates.push(new Date(parent.endDate));

                parent.children.forEach(child => {
                    const cd = getEffectiveTaskDates(child);
                    if (cd.start) allDates.push(cd.start);
                    if (cd.end) allDates.push(cd.end);

                    if (child.children) {
                        child.children.forEach(subchild => {
                            const sd = getEffectiveTaskDates(subchild);
                            if (sd.start) allDates.push(sd.start);
                            if (sd.end) allDates.push(sd.end);
                        });
                    }
                });
            });

            if (allDates.length === 0) {
                const today = new Date();
                allDates.push(today);
                allDates.push(addDays(today, 30));
            }

            let minDate = new Date(Math.min(...allDates));
            let maxDate = new Date(Math.max(...allDates));

            if (timelineViewMode === 'week') {
                minDate = getMonday(minDate);
                maxDate = addDays(getMonday(maxDate), 14);

                projectStartDate = minDate;
                projectEndDate = maxDate;

                weeksHeader = [];
                let curr = new Date(projectStartDate);

                while (curr < projectEndDate) {
                    const weekEnd = addDays(curr, 6);
                    const weekNum = getWeekNumber(curr);

                    weeksHeader.push({
                        label: `Sett. ${weekNum}`,
                        rangeText: `${formatShortDate(curr)} - ${formatShortDate(weekEnd)}`,
                        startDate: new Date(curr),
                        endDate: weekEnd,
                        daysCount: 7
                    });

                    curr = addDays(curr, 7);
                }
            } else {
                minDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
                maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth() + 2, 0);

                projectStartDate = minDate;
                projectEndDate = maxDate;

                weeksHeader = [];
                let curr = new Date(minDate);

                while (curr <= maxDate) {
                    const monthName = curr.toLocaleDateString('it-IT', { month: 'short', year: '2-digit' });
                    const daysInMonth = new Date(curr.getFullYear(), curr.getMonth() + 1, 0).getDate();
                    const monthEnd = new Date(curr.getFullYear(), curr.getMonth(), daysInMonth);

                    weeksHeader.push({
                        label: monthName.toUpperCase(),
                        rangeText: `${daysInMonth} giorni`,
                        startDate: new Date(curr),
                        endDate: monthEnd,
                        daysCount: daysInMonth
                    });

                    curr = new Date(curr.getFullYear(), curr.getMonth() + 1, 1);
                }
            }
        }

        function renderGlobalBackgroundGrid(totalTimelineWidth) {
            const gridContainer = document.getElementById('ganttGridBackground');
            if (!gridContainer) return;

            gridContainer.style.left = `${leftColWidth}px`;
            gridContainer.style.width = `${totalTimelineWidth}px`;

            let html = '';
            let totalColumns = weeksHeader.length;

            const today = new Date();
            const todayNormalized = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            if (timelineViewMode === 'week') {
                let totalDays = totalColumns * WEEK_DAYS;
                const startNormalized = new Date(projectStartDate.getFullYear(), projectStartDate.getMonth(), projectStartDate.getDate());
                const diffDaysToday = Math.round((todayNormalized - startNormalized) / (1000 * 60 * 60 * 24));

                for (let d = 0; d < totalDays; d++) {
                    const leftPos = d * dayWidth;

                    if (d === diffDaysToday) {
                        html += `<div class="today-column-bg" style="left: ${leftPos}px; width: ${dayWidth}px;" title="Oggi"></div>`;
                    }

                    if (d === diffDaysToday || d === diffDaysToday + 1) {
                        html += `<div class="today-dotted-line" style="left: ${leftPos}px;" title="Oggi"></div>`;
                    } else if (d > 0 && d % WEEK_DAYS === 0) {
                        html += `<div class="week-grid-line" style="left: ${leftPos}px;"></div>`;
                    } else if (d > 0) {
                        html += `<div class="day-grid-line" style="left: ${leftPos}px;"></div>`;
                    }
                }
            } else {
                let currentLeft = 0;
                weeksHeader.forEach((col, idx) => {
                    const colWidth = col.daysCount * dayWidth;

                    for (let day = 0; day < col.daysCount; day++) {
                        const dayDate = addDays(col.startDate, day);
                        const dayLeft = currentLeft + (day * dayWidth);

                        if (dayDate.getTime() === todayNormalized.getTime()) {
                            html += `<div class="today-column-bg" style="left: ${dayLeft}px; width: ${dayWidth}px;" title="Oggi"></div>`;
                            html += `<div class="today-dotted-line" style="left: ${dayLeft}px;" title="Oggi"></div>`;
                        }
                        else if (dayDate.getDay() === 1 && day > 0) {
                            html += `<div class="day-grid-line" style="left: ${dayLeft}px;" title="Inizio Settimana"></div>`;
                        }
                    }

                    if (idx > 0) {
                        html += `<div class="month-grid-line" style="left: ${currentLeft}px;"></div>`;
                    }
                    currentLeft += colWidth;
                });
            }

            gridContainer.innerHTML = html;
        }

        function renderGantt() {
            calculateRollups();
            calculateTimelineRange();

            const totalTimelineWidth = weeksHeader.reduce((sum, col) => sum + (col.daysCount * dayWidth), 0);

            const headerRow = document.getElementById('ganttHeaderRow');
            headerRow.innerHTML = `
                <th id="leftHeaderCol" class="sticky-col-header bg-slate-100 p-2.5 border-r border-slate-300 border-b border-slate-300 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]" style="width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;">
                    <div class="flex items-center justify-between pr-2">
                        <button id="editProjectNameBtn" onclick="editProjectName()" class="flex items-center space-x-2 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-200/60 transition-colors text-sm font-semibold group w-full justify-between" title="Clicca per modificare il nome del progetto">
                            <span id="projectNameDisplay" class="truncate">${escapeHtml(currentProjectName)}</span>
                            <i data-lucide="pencil" class="w-3.5 h-3.5 text-indigo-400 group-hover:text-indigo-600 transition-colors shrink-0"></i>
                        </button>
                    </div>
                    <div id="columnResizer" class="resizer-handle" title="Trascina per regolare la larghezza"></div>
                </th>
            `;

            weeksHeader.forEach(col => {
                const colWidth = col.daysCount * dayWidth;
                const th = document.createElement('th');

        function setupColumnResizer() {
            const stickyHeader = document.getElementById('stickyHeaderContainer');
            if (!stickyHeader) return;

            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            stickyHeader.addEventListener('mousedown', (e) => {
                const resizer = e.target.closest('#columnResizer');
                if (!resizer) return;

                isResizing = true;
                startX = e.clientX;
                startWidth = leftColWidth;
                resizer.classList.add('resizing');
                document.body.style.cursor = 'col-resize';

                const onMouseMove = (moveEvent) => {
                    if (!isResizing) return;
                    const dx = moveEvent.clientX - startX;
                    const newWidth = Math.max(280, Math.min(1000, startWidth + dx));
                    leftColWidth = newWidth;

                    document.querySelectorAll('.sticky-col, .sticky-col-header').forEach(el => {
                        el.style.width = `${newWidth}px`;
                        el.style.minWidth = `${newWidth}px`;
                        el.style.maxWidth = `${newWidth}px`;
                    });

                    const gridContainer = document.getElementById('ganttGridBackground');
                    if (gridContainer) gridContainer.style.left = `${newWidth}px`;
                };

                const onMouseUp = () => {
                    if (!isResizing) return;
                    isResizing = false;
                    resizer.classList.remove('resizing');
                    document.body.style.cursor = 'default';

                    localStorage.setItem('gantt_left_col_width_v1', leftColWidth);

                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function setupTimelineResizer() {
            const stickyHeader = document.getElementById('stickyHeaderContainer');
            if (!stickyHeader) return;

            stickyHeader.addEventListener('mousedown', (e) => {
                const resizer = e.target.closest('.timeline-resizer-handle');
                if (!resizer) return;

                e.stopPropagation();
                let isResizing = true;
                let startX = e.clientX;
                let startDayWidth = dayWidth;
                resizer.classList.add('resizing');
                document.body.style.cursor = 'col-resize';

                const onMouseMove = (moveEvent) => {
                    if (!isResizing) return;
                    const dx = moveEvent.clientX - startX;
                    const dayDelta = dx / (timelineViewMode === 'week' ? WEEK_DAYS : 30);
                    const newDayWidth = Math.max(3, Math.min(60, startDayWidth + dayDelta));
                    dayWidth = newDayWidth;
                    renderGantt();
                };

                const onMouseUp = () => {
                    if (!isResizing) return;
                    isResizing = false;
                    resizer.classList.remove('resizing');
                    document.body.style.cursor = 'default';

                    if (timelineViewMode === 'week') {
                        dayWidthWeek = dayWidth;
                        localStorage.setItem('gantt_day_width_week', dayWidthWeek);
                    } else {
                        dayWidthMonth = dayWidth;
                        localStorage.setItem('gantt_day_width_month', dayWidthMonth);
                    }

                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function calculateBarPosition(startDateStr, endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);

            const diffStartDays = Math.max(0, Math.round((start - projectStartDate) / (1000 * 60 * 60 * 24)));
            const durationDays = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1);

            return {
                left: diffStartDays * dayWidth,
                width: durationDays * dayWidth
            };
        }

        function shiftTaskHierarchy(taskItem, daysDelta) {
            if (daysDelta === 0) return;

            if (taskItem.startDate) {
                taskItem.startDate = formatDateToISO(addDays(new Date(taskItem.startDate), daysDelta));
            }
            if (taskItem.endDate) {
                taskItem.endDate = formatDateToISO(addDays(new Date(taskItem.endDate), daysDelta));
            }
            if (taskItem.plannedEndDate) {
                taskItem.plannedEndDate = formatDateToISO(addDays(new Date(taskItem.plannedEndDate), daysDelta));
            }

            if (taskItem.children && taskItem.children.length > 0) {
                taskItem.children.forEach(child => shiftTaskHierarchy(child, daysDelta));
            }
        }

        function attachDragEvents(barElem, taskItem, level, parentId, childId) {
            let isDragging = false;
            let isResizingLeft = false;
            let isResizingRight = false;
            let startX = 0;
            let initialLeft = 0;
            let initialWidth = 0;

            const hasChildren = taskItem.children && taskItem.children.length > 0;

            const onMouseDown = (e) => {
                const handle = e.target.getAttribute('data-handle');
                if (handle === 'left' && !hasChildren) {
                    isResizingLeft = true;
                } else if (handle === 'right' && !hasChildren) {
                    isResizingRight = true;
                } else {
                    isDragging = true;
                }

                startX = e.clientX;
                initialLeft = parseFloat(barElem.style.left) || 0;
                initialWidth = parseFloat(barElem.style.width) || dayWidth;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;

                const dx = e.clientX - startX;
                const daysDelta = Math.round(dx / dayWidth);

                if (isDragging) {
                    const newLeft = Math.max(0, initialLeft + (daysDelta * dayWidth));
                    barElem.style.left = `${newLeft}px`;
                } else if (isResizingRight) {
                    const newWidth = Math.max(dayWidth, initialWidth + (daysDelta * dayWidth));
                    barElem.style.width = `${newWidth}px`;
                } else if (isResizingLeft) {
                    const maxLeftShift = initialWidth / dayWidth - 1;
                    const clampedDays = Math.min(daysDelta, maxLeftShift);
                    const newLeft = Math.max(0, initialLeft + (clampedDays * dayWidth));
                    const newWidth = Math.max(dayWidth, initialWidth - (clampedDays * dayWidth));
                    barElem.style.left = `${newLeft}px`;
                    barElem.style.width = `${newWidth}px`;
                }
            };

            const onMouseUp = (e) => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;

                pushState();
				
                const finalLeft = parseFloat(barElem.style.left);
                const finalWidth = parseFloat(barElem.style.width);

                if (hasChildren && isDragging) {
                    const daysShift = Math.round((finalLeft - initialLeft) / dayWidth);
                    if (daysShift !== 0) {
                        shiftTaskHierarchy(taskItem, daysShift);
                    }
                } else {
                    const startDaysOffset = Math.round(finalLeft / dayWidth);
                    const durationDays = Math.round(finalWidth / dayWidth);

                    const slip = parseInt(taskItem.slipDays) || 0;
                    const newStart = addDays(projectStartDate, startDaysOffset - slip);
                    const newEnd = addDays(newStart, durationDays - 1);

                    taskItem.startDate = formatDateToISO(newStart);
                    taskItem.endDate = formatDateToISO(newEnd);
                    if (taskItem.plannedEndDate) {
                        taskItem.plannedEndDate = formatDateToISO(newEnd);
                    }
                }

                isDragging = false;
                isResizingLeft = false;
                isResizingRight = false;

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);

                saveGanttData();
                renderGantt();
            };

            barElem.addEventListener('mousedown', onMouseDown);
        }

        function duplicateParent(parentId) {
            const parentIdx = ganttData.findIndex(p => p.id === parentId);
            if (parentIdx === -1) return;

            const original = ganttData[parentIdx];
            const clonedParent = JSON.parse(JSON.stringify(original));

            clonedParent.id = 'parent-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clonedParent.title = `${original.title} (Copia)`;

            if (clonedParent.children) {
                clonedParent.children.forEach(c => {
                    c.id = 'child-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                    if (c.children) {
                        c.children.forEach(s => {
                            s.id = 'subchild-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                        });
                    }
                });
            }

            ganttData.splice(parentIdx + 1, 0, clonedParent);
            saveGanttData();
            renderGantt();
        }

        function toggleExpand(id, level) {
            if (level === 1) {
                const parent = ganttData.find(p => p.id === id);
                if (parent) parent.expanded = !parent.expanded;
            } else if (level === 2) {
                ganttData.forEach(p => {
                    const child = p.children ? p.children.find(c => c.id === id) : null;
                    if (child) child.expanded = (child.expanded === false) ? true : false;

            saveGanttData();
            renderGantt();

        function moveParent(parentId, direction) {
            const idx = ganttData.findIndex(p => p.id === parentId);
            if (idx === -1) return;

            if (direction === 'up' && idx > 0) {
                const temp = ganttData[idx];
                ganttData[idx] = ganttData[idx - 1];
                ganttData[idx - 1] = temp;
            } else if (direction === 'down' && idx < ganttData.length - 1) {
                const temp = ganttData[idx];
                ganttData[idx] = ganttData[idx + 1];
                ganttData[idx + 1] = temp;
            }

            saveGanttData();
            renderGantt();
        }

            const promptInput = document.getElementById('promptInputValue');

            if (confirmBtn) {
                confirmBtn.addEventListener('click', () => {
                    const val = promptInput.value;
                    if (promptCallback && val.trim() !== "") {
                        promptCallback(val.trim());
                    }
                    closePromptModal();

        function openEditModal(id, level) {

                const parent = ganttData.find(p => p.id === id);

                document.getElementById('modalTitle').innerText = "Modifica Gruppo Genitore (Livello 1)";
                document.getElementById('editTaskTitle').value = parent.title;
                document.getElementById('dateInputsGroup').classList.add('hidden');
                document.getElementById('delayDaysGroup').classList.add('hidden');
                document.getElementById('slipDaysGroup').classList.add('hidden');
                document.getElementById('progressInputGroup').classList.add('hidden');
                document.getElementById('colorPickerGroup').classList.remove('hidden');

                document.getElementById('editColorHex').value = parent.color || "#4f46e5";
                document.getElementById('editOpacity').value = parent.bgOpacity || 15;
                document.getElementById('opacityValue').innerText = `${parent.bgOpacity || 15}%`;

            } else {
                let targetTask = null;

                ganttData.forEach(p => {
                    if (level === 2) {
                        const found = p.children ? p.children.find(c => c.id === id) : null;
                        if (found) targetTask = found;
                    } else if (level === 3) {
                        if (p.children) {
                            p.children.forEach(c => {
                                const foundSub = c.children ? c.children.find(s => s.id === id) : null;
                                if (foundSub) targetTask = foundSub;
                            });
                        }
                    }
                });

                if (!targetTask) return;

                const hasChildren = targetTask.children && targetTask.children.length > 0;

                document.getElementById('modalTitle').innerText = level === 2 ? "Modifica Sotto-attività (Livello 2)" : "Modifica Sotto-sotto-attività (Livello 3)";
                document.getElementById('editTaskTitle').value = targetTask.title;

                if (hasChildren) {
                    document.getElementById('dateInputsGroup').classList.add('hidden');
                    document.getElementById('delayDaysGroup').classList.add('hidden');
                    document.getElementById('slipDaysGroup').classList.add('hidden');
                    document.getElementById('progressInputGroup').classList.add('hidden');
                } else {
                    document.getElementById('dateInputsGroup').classList.remove('hidden');
                    document.getElementById('delayDaysGroup').classList.remove('hidden');
                    document.getElementById('slipDaysGroup').classList.remove('hidden');
                    document.getElementById('progressInputGroup').classList.remove('hidden');
                }

                document.getElementById('colorPickerGroup').classList.add('hidden');

                document.getElementById('editStartDate').value = targetTask.startDate || "";
                document.getElementById('editEndDate').value = targetTask.endDate || "";
                document.getElementById('editDelayDays').value = targetTask.delayDays || 0;
                document.getElementById('editDelayReason').value = targetTask.delayReason || "";
                document.getElementById('editSlipDays').value = targetTask.slipDays || 0;
                document.getElementById('editSlipReason').value = targetTask.slipReason || "";
                document.getElementById('editProgress').value = targetTask.progress || 0;
                document.getElementById('progressValue').innerText = `${targetTask.progress || 0}%`;
            }

            modal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function setPresetColor(colorHex) {
            document.getElementById('editColorHex').value = colorHex;
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            pushState();
			
            const id = document.getElementById('editTaskId').value;
            const level = parseInt(document.getElementById('editTaskLevel').value, 10);
            const title = document.getElementById('editTaskTitle').value;

            if (level === 1) {
                const parent = ganttData.find(p => p.id === id);
                if (parent) {
                    parent.title = title;
                    parent.color = document.getElementById('editColorHex').value;
                    parent.bgOpacity = parseInt(document.getElementById('editOpacity').value, 10);
                }
            } else {
                ganttData.forEach(p => {
                    if (level === 2 && p.children) {
                        const child = p.children.find(c => c.id === id);
                        if (child) {
                            child.title = title;
                            const hasChildren = child.children && child.children.length > 0;
                            if (!hasChildren) {
                                child.startDate = document.getElementById('editStartDate').value;
                                child.endDate = document.getElementById('editEndDate').value;
                                child.delayDays = parseInt(document.getElementById('editDelayDays').value, 10) || 0;
                                child.delayReason = document.getElementById('editDelayReason').value;
                                child.slipDays = parseInt(document.getElementById('editSlipDays').value, 10) || 0;
                                child.slipReason = document.getElementById('editSlipReason').value;
                                child.progress = parseInt(document.getElementById('editProgress').value, 10);
                            }
                        }
                    } else if (level === 3 && p.children) {
                        p.children.forEach(c => {
                            if (c.children) {
                                const subchild = c.children.find(s => s.id === id);
                                if (subchild) {
                                    subchild.title = title;
                                    subchild.startDate = document.getElementById('editStartDate').value;
                                    subchild.endDate = document.getElementById('editEndDate').value;
                                    subchild.delayDays = parseInt(document.getElementById('editDelayDays').value, 10) || 0;
                                    subchild.delayReason = document.getElementById('editDelayReason').value;
                                    subchild.slipDays = parseInt(document.getElementById('editSlipDays').value, 10) || 0;
                                    subchild.slipReason = document.getElementById('editSlipReason').value;
                                    subchild.progress = parseInt(document.getElementById('editProgress').value, 10);
                                }
                            }
                        });
                    }
                });
            }

            saveGanttData();
            renderGantt();
            closeEditModal();
        });

        document.getElementById('editOpacity').addEventListener('input', (e) => {
            document.getElementById('opacityValue').innerText = `${e.target.value}%`;
        });

        document.getElementById('editProgress').addEventListener('input', (e) => {
            document.getElementById('progressValue').innerText = `${e.target.value}%`;
        });

        function promptDelete(id, level) {
            pendingDeleteId = id;
            pendingDeleteLevel = level;

            const messageElem = document.getElementById('deleteModalMessage');
            if (level === 1) {
                messageElem.innerText = "Sei sicuro di voler eliminare questo gruppo e tutte le sotto-attività collegate?";
            } else if (level === 2) {
                messageElem.innerText = "Sei sicuro di voler eliminare questa sotto-attività e le sotto-sotto-attività?";
            } else {
                messageElem.innerText = "Sei sicuro di voler eliminare questa sotto-sotto-attività?";
            }

            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteId = null;
            pendingDeleteLevel = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (!pendingDeleteId) return;
			
            pushState();

            if (pendingDeleteId === "RESET") {
                const metaEl = document.getElementById('gantt-embedded-meta');
                if (metaEl) {
                    try {
                        const parsed = JSON.parse(metaEl.textContent);
                        ganttData = JSON.parse(JSON.stringify(parsed.data));
                        currentProjectName = parsed.projectName || "Progetto Prova";
                    } catch(e) {
                        ganttData = [];
                    }
                } else {
                    ganttData = [];
                    currentProjectName = "Nuovo Progetto";
                }
                updateProjectNameUI();
                saveGanttData();
                renderGantt();
                closeDeleteModal();
                return;
            }

            if (pendingDeleteId === "ALL") {
                ganttData = [];
                currentProjectName = "Nuovo Progetto";
                updateProjectNameUI();
                saveGanttData();
                renderGantt();
                closeDeleteModal();
                return;
            }

            if (pendingDeleteLevel === 1) {
                ganttData = ganttData.filter(p => p.id !== pendingDeleteId);
            } else if (pendingDeleteLevel === 2) {
                ganttData.forEach(p => {
                    if (p.children) p.children = p.children.filter(c => c.id !== pendingDeleteId);
                });
            } else if (pendingDeleteLevel === 3) {
                ganttData.forEach(p => {
                    if (p.children) {
                        p.children.forEach(c => {
                            if (c.children) c.children = c.children.filter(s => s.id !== pendingDeleteId);
                        });
                    }
                });
            }

            saveGanttData();
            renderGantt();
            closeDeleteModal();
        });

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGantt();
            });

            // GESTORE IMPORTAZIONE FILE JSON UNIFICATO E SICURO
            document.getElementById('importInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        let rawData = [];
                        let rawName = null;

                        if (Array.isArray(parsed)) {
                            rawData = parsed;
                        } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.data)) {
                            rawData = parsed.data;
                            if (parsed.projectName) rawName = parsed.projectName;
                        } else {
                            throw new Error("Struttura JSON non riconosciuta.");
                        }

                        if (!validateAndSanitizeData(rawData)) {
                            alert("Errore: Il file JSON contiene una struttura non valida o potenzialmente pericolosa.");
                            return;
                        }

                        pushState();
                        ganttData = rawData;
                        if (rawName) {
                            currentProjectName = rawName;
                            updateProjectNameUI();
                        }
                        saveGanttData();
                        renderGantt();
                    } catch (err) {
                        alert("File JSON non valido o corrotto.");
                    } finally {
                        e.target.value = ''; // Reset per consentire re-importazione dello stesso file
                    }
                };
                reader.readAsText(file);
            });

            document.getElementById('exportHtmlBtn').addEventListener('click', () => {
                const sanitizedProjName = currentProjectName.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const defaultFileName = `${sanitizedProjName}_${new Date().toISOString().slice(0, 10)}`;
                
                showCustomPrompt("Nome file HTML di esportazione", defaultFileName, (customName) => {
                    if (!customName.endsWith('.html')) {
                        customName += '.html';
                    }

                    const cloneDoc = document.documentElement.cloneNode(true);
                    
                    const metaScript = cloneDoc.querySelector('#gantt-embedded-meta');
                    if (metaScript) {
                        const payload = {
                            projectId: currentProjectId,
                            projectName: currentProjectName,
                            data: ganttData
                        };
                        metaScript.textContent = JSON.stringify(payload, null, 2);
                    }

                    const finalHtml = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
                    const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = url;
                    downloadAnchor.download = customName;
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    URL.revokeObjectURL(url);
                });
            });

            document.getElementById('exportBtn').addEventListener('click', () => {
                const sanitizedProjName = currentProjectName.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const defaultFileName = `${sanitizedProjName}_${new Date().toISOString().slice(0, 10)}`;
                
                showCustomPrompt("Nome file JSON di esportazione", defaultFileName, (customName) => {
                    if (!customName.endsWith('.json')) {
                        customName += '.json';
                    }

                    const exportObj = {
                        projectName: currentProjectName,
                        data: ganttData
                    };

                    const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json;charset=utf-8' });
                    const url = URL.createObjectURL(blob);

                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = url;
                    downloadAnchor.download = customName;
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    URL.revokeObjectURL(url);
                });
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                pendingDeleteId = "ALL";
                pendingDeleteLevel = 0;
                document.getElementById('deleteModalMessage').innerText = "Sei sicuro di voler eliminare tutto il progetto? L'operazione non è reversibile!";
                document.getElementById('deleteModal').classList.remove('hidden');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                pendingDeleteId = "RESET";
                pendingDeleteLevel = 0;
                document.getElementById('deleteModalMessage').innerText = "Sei sicuro di voler cancellare tutto e ripristinare i dati iniziali?";
                document.getElementById('deleteModal').classList.remove('hidden');
            });
        }

        // Ascoltatore globale per le scorciatoie da tastiera 
        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement.tagName;
            const isInputActive = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag);

            const isCtrlOrMeta = e.ctrlKey || e.metaKey;

            if (isCtrlOrMeta && e.key.toLowerCase() === 's') {
                e.preventDefault();
                document.getElementById('exportBtn').click();
                return;
            }

            if (isCtrlOrMeta && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                const searchInput = document.getElementById('searchInput');
                searchInput.focus();
                searchInput.select();
                return;
            }

            if (isInputActive) {
                return;
            }

            if (isCtrlOrMeta && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    performRedo();
                } else {
                    performUndo();
                }
            } else if (isCtrlOrMeta && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                performRedo();
            }

            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedTaskId && selectedTaskLevel) {
                e.preventDefault();
                promptDelete(selectedTaskId, selectedTaskLevel);
            }
        });

        function formatDateToISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatShortDate(date) {
            const d = date.getDate().toString().padStart(2, '0');
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            return `${d}/${m}`;
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function getWeekNumber(d) {
            const target = new Date(d.valueOf());
            target.setHours(0, 0, 0, 0);
            target.setDate(target.getDate() + 3 - (target.getDay() + 6) % 7);
            const yearStart = new Date(target.getFullYear(), 0, 1);
            const weekNumber = Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
            return weekNumber;
        }

        function getSolidTint(hex, opacity) {
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;

            const nr = Math.round(r * opacity + 255 * (1 - opacity));
            const ng = Math.round(g * opacity + 255 * (1 - opacity));
            const nb = Math.round(b * opacity + 255 * (1 - opacity));

            return `#${((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1)}`;
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
