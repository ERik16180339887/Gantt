    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .gantt-table { table-layout: fixed; width: max-content; border-collapse: separate; border-spacing: 0; }
        .sticky-col { position: sticky; left: 0; z-index: 20; }
        .sticky-col-header { position: sticky; left: 0; top: 0; z-index: 50 !important; background-color: #f1f5f9 !important; }

        .resizer-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; user-select: none; z-index: 55; }
        .resizer-handle:hover, .resizer-handle.resizing { background-color: #6366f1; }
        .timeline-resizer-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; user-select: none; z-index: 35; }
        .timeline-resizer-handle:hover, .timeline-resizer-handle.resizing { background-color: #6366f1; }

        .gantt-grid-overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 5; }
        .day-grid-line { position: absolute; top: 0; bottom: 0; border-right: 1px dotted #cbd5e1; pointer-events: none; }
        .week-grid-line { position: absolute; top: 0; bottom: 0; border-right: 1px solid #cbd5e1; pointer-events: none; z-index: 2; }
        .month-grid-line { position: absolute; top: 0; bottom: 0; border-right: 1px solid #94a3b8; pointer-events: none; z-index: 2; }

        .today-dotted-line { position: absolute; top: 0; bottom: 0; border-right: 2px dotted #ef4444; pointer-events: none; z-index: 12; }
        .today-column-bg { position: absolute; top: 0; bottom: 0; background-color: rgba(239, 68, 68, 0.08); pointer-events: none; z-index: 1; }

        .milestone-dotted-line { position: absolute; top: 0; bottom: 0; border-right: 2px dashed #059669; pointer-events: none; z-index: 11; }
        .milestone-badge-header { position: absolute; top: 2px; transform: translateX(-50%); z-index: 45; pointer-events: auto; }

        .baseline-bar { position: absolute; height: 4px; bottom: 1px; background-color: #cbd5e1; border-radius: 2px; pointer-events: none; z-index: 8; }
        .baseline-bar-parent { position: absolute; height: 4px; bottom: 2px; background-color: #94a3b8; border-radius: 2px; pointer-events: none; z-index: 8; }

        body.view-mode .action-buttons { display: none !important; }
        @media print {
            header, .action-bar, .action-buttons, #toggleEditModeBtn, #addParentBtn, #searchInput, #toggleViewModeBtn { display: none !important; }
        }
    </style>
</head>

    <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex flex-wrap items-center justify-between gap-4 shrink-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="text-white flex items-center justify-center">
                <svg class="w-12 h-12 shadow-md rounded-2xl" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="64" height="64" rx="4" fill="#4F46E5"/>
                    <g transform="translate(7, 7) scale(0.78)">
                        <rect x="4.03" y="4.03" width="55.92" height="12.42" rx="6.21" fill="#eef2ff"/>
                        <rect x="25.78" y="25.78" width="34.17" height="12.42" rx="6.21" fill="#c7d2fe"/>
                        <rect x="4.03" y="47.53" width="55.92" height="12.42" rx="6.21" fill="#818cf8"/>
                        <rect x="4.03" y="4.03" width="12.42" height="55.92" rx="6.21" fill="#ffffff"/>
                        <rect x="47.53" y="25.78" width="12.42" height="34.17" rx="6.21" fill="#818cf8"/>
                        <circle cx="32.46" cy="32" fill="#4f46e5" r="4.66"/>
                    </g>
                </svg>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">G-Gantt</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded border border-emerald-200">v1.1</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">Pianificazione e condivisione file singolo (Licenza GNU GPLv3)</p>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-3">
            <button id="exportHtmlBtn" class="bg-green-500 hover:bg-green-700 text-white font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors">
                <i data-lucide="file-code" class="w-4 h-4"></i>
                <span class="hidden md:inline">Esporta HTML Unico</span>
            </button>
            <button id="exportBtn" class="bg-slate-200 hover:bg-slate-400 text-slate-700 font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Salva</span>
            </button>
            <label class="bg-slate-200 hover:bg-slate-400 text-slate-700 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors cursor-pointer">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Importa</span>
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>
            <button id="clearBtn" class="bg-red-400 hover:bg-red-700 text-white font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button id="resetBtn" class="bg-yellow-200 hover:bg-indigo-50 text-slate-600 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div class="action-bar bg-white border-b border-slate-200 px-6 py-2.5 flex flex-wrap items-center justify-start gap-3 shadow-sm shrink-0 z-40">
        <div class="relative w-48 lg:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Cerca attività..." class="pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full bg-white">
        </div>

        <button id="addParentBtn" onclick="addNewParentTask()" class="bg-indigo-600 hover:bg-cyan-400 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors">
            <i data-lucide="folder-plus" class="w-4 h-4"></i>
            <span>Nuovo Gruppo</span>
        </button>

        <button onclick="openMilestonesModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors">
            <i data-lucide="flag" class="w-4 h-4"></i>
            <span>Milestone</span>
        </button>

        <button onclick="shiftEntireProject()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 border border-indigo-200 transition-colors">
            <i data-lucide="calendar-plus" class="w-4 h-4"></i>
            <span>Sposta Progetto</span>
        </button>

        <button id="toggleEditModeBtn" onclick="toggleEditMode()" class="bg-orange-300 hover:bg-lime-300 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 transition-colors">
            <i data-lucide="pencil" id="toggleEditIcon" class="w-4 h-4 text-amber-600"></i>
            <span id="toggleEditText">Modalità Modifica</span>
        </button>

        <div class="flex items-center space-x-1 border-l border-slate-200 pl-3">
            <button id="undoBtn" onclick="performUndo()" disabled class="bg-slate-100 text-slate-400 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button id="redoBtn" onclick="performRedo()" disabled class="bg-slate-100 text-slate-400 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>
        </div>

        <button id="toggleViewModeBtn" onclick="toggleTimelineView()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-sm flex items-center space-x-1.5 transition-colors ml-auto">
            <i data-lucide="calendar" class="w-4 h-4 text-indigo-600"></i>
            <span id="toggleViewText">Vista: Settimanale</span>
        </button>
    </div>

    <main class="flex-1 p-4 md:p-6 overflow-hidden flex flex-col">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative">
            <div id="stickyHeaderContainer" class="shrink-0 z-30 bg-slate-100 border-b border-slate-200 overflow-hidden relative">
                <table class="gantt-table border-collapse text-left">
                    <thead>
                        <tr id="ganttHeaderRow" class="text-xs text-slate-600 font-semibold"></tr>
                    </thead>
                </table>
            </div>

            <div id="ganttScrollContainer" class="flex-1 overflow-auto relative">
                <div id="ganttGridBackground" class="gantt-grid-overlay"></div>
                <table id="ganttTable" class="gantt-table border-collapse text-left relative z-10">
                    <tbody id="ganttBody" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- GESTIONE MILESTONES MODAL -->
    <div id="milestonesModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all flex flex-col max-h-[85vh]">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-2">
                    <i data-lucide="flag" class="w-5 h-5 text-emerald-600"></i>
                    <h3 class="font-semibold text-slate-800 text-base">Gestione Milestone di Progetto</h3>
                </div>
                <button onclick="closeMilestonesModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-5 space-y-4 overflow-y-auto flex-1">
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Aggiungi Nuova Milestone</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <input type="text" id="newMsName" placeholder="Nome (es. Collaudo)" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none col-span-1 sm:col-span-3">
                        <input type="date" id="newMsDate" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none col-span-2">
                        <div class="flex items-center space-x-1.5">
                            <input type="color" id="newMsColor" value="#059669" class="w-9 h-9 rounded border border-slate-300 cursor-pointer p-0 bg-transparent">
                            <button onclick="addMilestoneFromModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-3 rounded-lg text-sm transition-colors shadow-sm">
                                Aggiungi
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Milestone Attive</h4>
                    <div id="milestonesListContainer" class="space-y-2"></div>
                </div>
            </div>

            <div class="flex justify-end px-5 py-3 bg-slate-50 border-t border-slate-100 shrink-0">
                <button type="button" onclick="closeMilestonesModal()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900 shadow-sm">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT TASK -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                <h3 id="modalTitle" class="font-semibold text-slate-800 text-base">Modifica Attività</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="editForm" class="p-5 space-y-4 overflow-y-auto">
                <input type="hidden" id="editTaskId">
                <input type="hidden" id="editTaskLevel">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nome Attività</label>
                    <input type="text" id="editTaskTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div id="dateInputsGroup" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Inizio</label>
                        <input type="date" id="editStartDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Fine</label>
                        <input type="date" id="editEndDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div id="slipDaysGroup" class="grid grid-cols-2 gap-3 p-2.5 bg-red-50/60 rounded-xl border border-red-100">
                    <div>
                        <label class="block text-xs font-semibold text-red-700 uppercase tracking-wider mb-1">Slittamento Iniziale (g)</label>
                        <input type="number" id="editSlipDays" min="0" max="90" value="0" class="w-full px-3 py-1.5 border border-red-200 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-red-700 uppercase tracking-wider mb-1">Causa Slittamento</label>
                        <input type="text" id="editSlipReason" placeholder="Es. Permessi in attesa..." class="w-full px-3 py-1.5 border border-red-200 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
                    </div>
                </div>

                <div id="delayDaysGroup" class="grid grid-cols-2 gap-3 p-2.5 bg-amber-50/60 rounded-xl border border-amber-100">
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 uppercase tracking-wider mb-1">Ritardo Finale Extra (g)</label>
                        <input type="number" id="editDelayDays" min="0" max="90" value="0" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-amber-800 uppercase tracking-wider mb-1">Causa Ritardo</label>
                        <input type="text" id="editDelayReason" placeholder="Es. Attesa materiale..." class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    </div>
                </div>

                <div id="progressInputGroup">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Avanzamento (%): <span id="progressValue" class="text-indigo-600 font-bold">0%</span></label>
                    </div>

    <div id="customTooltip" class="fixed hidden z-50 bg-slate-900 text-white text-xs rounded-lg shadow-xl p-3 max-w-xs pointer-events-none transition-opacity duration-150"></div>

    <script>
        let ganttData = [];
        let milestones = [];
        let currentProjectName = "Progetto Prova";
        let currentProjectId = "proj_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
        let weeksHeader = [];
        let selectedTaskId = null;
        let selectedTaskLevel = null;
        let projectStartDate = null;
        let projectEndDate = null;
        let pendingDeleteId = null;
        let pendingDeleteLevel = null;
        let searchQuery = "";
        let isEditMode = localStorage.getItem('gantt_edit_mode') === 'true';
        let timelineViewMode = localStorage.getItem('gantt_timeline_view') || 'week';

        let leftColWidth = parseInt(localStorage.getItem('gantt_left_col_width_v1'), 10) || 600;
        let dayWidthWeek = parseFloat(localStorage.getItem('gantt_day_width_week')) || 22;
        let dayWidthMonth = parseFloat(localStorage.getItem('gantt_day_width_month')) || 6;
        let dayWidth = (timelineViewMode === 'week') ? dayWidthWeek : dayWidthMonth;

        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 30;
        const WEEK_DAYS = 7;

        window.addEventListener('DOMContentLoaded', () => {
            loadGanttData();
            setupEventListeners();
            setupColumnResizer();
            setupTimelineResizer();
            setupScrollSync();
            applyEditModeUI();
            applyViewModeUI();
            lucide.createIcons();
            renderGantt();
        });

        function sanitizeInput(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
        }

        function validateAndSanitizeData(dataArray) {
            if (!Array.isArray(dataArray)) return false;
            for (const parent of dataArray) {
                if (typeof parent !== 'object' || parent === null) return false;
                parent.title = sanitizeInput(parent.title || "Gruppo senza nome");
                if (Array.isArray(parent.children)) {
                    for (const child of parent.children) {
                        if (typeof child !== 'object' || child === null) return false;
                        child.title = sanitizeInput(child.title || "Attività senza nome");
                        if (Array.isArray(child.children)) {
                            for (const sub of child.children) {
                                if (typeof sub !== 'object' || sub === null) return false;
                                sub.title = sanitizeInput(sub.title || "Sotto-attività");
                            }
                        }
                    }
                }
            }
            return true;
        }

        function pushState() {
            const currentState = {
                projectName: currentProjectName,
                milestones: structuredClone(milestones),
                data: structuredClone(ganttData)
            };
            if (undoStack.length > 0 && JSON.stringify(undoStack[undoStack.length - 1]) === JSON.stringify(currentState)) return;
            undoStack.push(currentState);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateUndoRedoUI();
        }

        function performUndo() {
            if (undoStack.length === 0) return;
            const currentState = { projectName: currentProjectName, milestones: structuredClone(milestones), data: structuredClone(ganttData) };
            redoStack.push(currentState);
            const previousState = undoStack.pop();
            currentProjectName = previousState.projectName;
            milestones = previousState.milestones || [];
            ganttData = previousState.data;
            updateProjectNameUI();
            saveGanttData();
            renderGantt();
            updateUndoRedoUI();
        }

        function performRedo() {
            if (redoStack.length === 0) return;
            const currentState = { projectName: currentProjectName, milestones: structuredClone(milestones), data: structuredClone(ganttData) };
            undoStack.push(currentState);
            const nextState = redoStack.pop();
            currentProjectName = nextState.projectName;
            milestones = nextState.milestones || [];
            ganttData = nextState.data;
            updateProjectNameUI();
            saveGanttData();
            renderGantt();
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) {
                undoBtn.disabled = undoStack.length === 0;
                undoBtn.className = undoStack.length === 0 ? "bg-slate-100 text-slate-300 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed" : "bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors shadow-sm";
            }
            if (redoBtn) {
                redoBtn.disabled = redoStack.length === 0;
                redoBtn.className = redoStack.length === 0 ? "bg-slate-100 text-slate-300 font-medium p-2 rounded-lg text-sm flex items-center opacity-40 cursor-not-allowed" : "bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2 rounded-lg text-sm flex items-center transition-colors shadow-sm";
            }
        }

        function loadGanttData() {
            let loadedFromMeta = false;
            try {
                const metaEl = document.getElementById('gantt-embedded-meta');
                if (metaEl && metaEl.textContent.trim() !== '') {
                    const parsedMeta = JSON.parse(metaEl.textContent);
                    if (parsedMeta && Array.isArray(parsedMeta.data) && parsedMeta.data.length > 0) {
                        currentProjectId = parsedMeta.projectId || currentProjectId;
                        currentProjectName = parsedMeta.projectName || "Progetto Esportato";
                        milestones = Array.isArray(parsedMeta.milestones) ? parsedMeta.milestones : [];
                        ganttData = parsedMeta.data;
                        loadedFromMeta = true;
                    }
                }
            } catch (e) { console.error("Errore lettura meta embedded:", e); }

            if (!loadedFromMeta) {
                const stored = localStorage.getItem('gantt_chart_data_' + currentProjectId);
                if (stored) { try { ganttData = JSON.parse(stored); } catch (e) {} }
                const storedMs = localStorage.getItem('gantt_milestones_' + currentProjectId);
                if (storedMs) { try { milestones = JSON.parse(storedMs); } catch(e){} }
                const storedName = localStorage.getItem('gantt_project_name_' + currentProjectId);
                if (storedName) currentProjectName = storedName;
            }
            updateProjectNameUI();
            calculateRollups();
        }

        let saveTimeout = null;
        function saveGanttData() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                try {
                    localStorage.setItem('gantt_chart_data_' + currentProjectId, JSON.stringify(ganttData));
                    localStorage.setItem('gantt_milestones_' + currentProjectId, JSON.stringify(milestones));
                    localStorage.setItem('gantt_project_name_' + currentProjectId, currentProjectName);
                } catch (e) { console.warn("Impossibile salvare su localStorage:", e); }
                saveTimeout = null;
            }, 200);
        }

        function setupScrollSync() {
            const scrollContainer = document.getElementById('ganttScrollContainer');
            const stickyHeader = document.getElementById('stickyHeaderContainer');
            if (scrollContainer && stickyHeader) {
                scrollContainer.addEventListener('scroll', () => { stickyHeader.scrollLeft = scrollContainer.scrollLeft; });
            }
        }

        function applyEditModeUI() {
            const btnText = document.getElementById('toggleEditText');
            const btnIcon = document.getElementById('toggleEditIcon');
            if (isEditMode) {
                document.body.classList.remove('view-mode');
                if (btnText) btnText.innerText = "Modalità Modifica";
                if (btnIcon) { btnIcon.setAttribute('data-lucide', 'pencil'); btnIcon.className = "w-4 h-4 text-amber-600"; }
            } else {
                document.body.classList.add('view-mode');
                if (btnText) btnText.innerText = "Modalità Vista";
                if (btnIcon) { btnIcon.setAttribute('data-lucide', 'eye'); btnIcon.className = "w-4 h-4 text-indigo-600"; }
            }
            lucide.createIcons();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            localStorage.setItem('gantt_edit_mode', isEditMode);
            applyEditModeUI();
        }

        function applyViewModeUI() {
            const btnText = document.getElementById('toggleViewText');
            if (btnText) btnText.innerText = (timelineViewMode === 'week') ? 'Vista: Settimanale' : 'Vista: Mensile';
        }

        function toggleTimelineView() {
            timelineViewMode = (timelineViewMode === 'week') ? 'month' : 'week';
            localStorage.setItem('gantt_timeline_view', timelineViewMode);
            dayWidth = (timelineViewMode === 'week') ? dayWidthWeek : dayWidthMonth;
            applyViewModeUI();
            renderGantt();
        }

        function updateProjectNameUI() {
            const disp = document.getElementById('projectNameDisplay');
            if (disp) disp.innerText = currentProjectName;
            document.title = currentProjectName;
        }

        function editProjectName() {
            showCustomPrompt("Modifica nome del Progetto", currentProjectName, (newName) => {
                currentProjectName = newName;
                updateProjectNameUI();
                saveGanttData();
            });
        }

        function getTaskDurationDays(startDateStr, endDateStr, delayDays = 0) {
            if (!startDateStr || !endDateStr) return 1;
            const start = new Date(startDateStr);
            const baseEnd = new Date(endDateStr);
            const diffTime = Math.max(0, baseEnd - start);
            const baseDays = Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
            return baseDays + (parseInt(delayDays) || 0);
        }

        function getEffectiveTaskDates(task) {
            if (!task.startDate || !task.endDate) return { start: null, end: null, baseEnd: null };
            const slip = parseInt(task.slipDays) || 0;
            const start = addDays(new Date(task.startDate), slip);
            const baseEnd = addDays(new Date(task.plannedEndDate || task.endDate), slip);
            const end = addDays(baseEnd, parseInt(task.delayDays) || 0);
            return { start, end, baseEnd };
        }

        function calculateRollups() {
            ganttData.forEach(parent => {
                if (!parent.children || parent.children.length === 0) {
                    parent.startDate = ""; parent.endDate = ""; parent.plannedEndDate = ""; parent.plannedStartDate = ""; parent.progress = 0;
                    return;
                }
                let parentMinStart = null, parentMinPlannedStart = null, parentMaxPlannedEnd = null, parentMaxEffectiveEnd = null;
                let parentTotalWeightedProgressDays = 0, parentTotalDurationDays = 0;

                parent.children.forEach(child => {
                    const origStart = child.startDate ? new Date(child.startDate) : null;
                    const origEnd = (child.plannedEndDate || child.endDate) ? new Date(child.plannedEndDate || child.endDate) : null;
                    if (origStart && (!parentMinPlannedStart || origStart < parentMinPlannedStart)) parentMinPlannedStart = origStart;
                    if (origEnd && (!parentMaxPlannedEnd || origEnd > parentMaxPlannedEnd)) parentMaxPlannedEnd = origEnd;

                    if (child.children && child.children.length > 0) {
                        let childMinStart = null, childMaxPlannedEnd = null, childMaxEffectiveEnd = null;
                        let childTotalWeightedProgressDays = 0, childTotalDurationDays = 0;

                        child.children.forEach(subchild => {
                            const dates = getEffectiveTaskDates(subchild);
                            if (dates.start) {
                                if (!childMinStart || dates.start < childMinStart) childMinStart = dates.start;
                                if (!childMaxPlannedEnd || dates.baseEnd > childMaxPlannedEnd) childMaxPlannedEnd = dates.baseEnd;
                                if (!childMaxEffectiveEnd || dates.end > childMaxEffectiveEnd) childMaxEffectiveEnd = dates.end;
                            }
                            const subDuration = getTaskDurationDays(subchild.startDate, subchild.plannedEndDate || subchild.endDate, subchild.delayDays);
                            const subProgress = parseInt(subchild.progress) || 0;
                            childTotalWeightedProgressDays += subDuration * (subProgress / 100);
                            childTotalDurationDays += subDuration;
                        });

                        child.startDate = childMinStart ? formatDateToISO(childMinStart) : "";
                        child.plannedEndDate = childMaxPlannedEnd ? formatDateToISO(childMaxPlannedEnd) : "";
                        child.endDate = childMaxEffectiveEnd ? formatDateToISO(childMaxEffectiveEnd) : "";
                        child.progress = childTotalDurationDays > 0 ? Math.round((childTotalWeightedProgressDays / childTotalDurationDays) * 100) : 0;
                        if (childMaxPlannedEnd && childMaxEffectiveEnd) {
                            child.delayDays = Math.max(0, Math.round((childMaxEffectiveEnd - childMaxPlannedEnd) / (1000 * 60 * 60 * 24)));
                        }
                        child.slipDays = 0; child.slipReason = "";
                    }

                    const cDates = getEffectiveTaskDates(child);
                    if (cDates.start) {
                        if (!parentMinStart || cDates.start < parentMinStart) parentMinStart = cDates.start;
                        if (!parentMaxEffectiveEnd || cDates.end > parentMaxEffectiveEnd) parentMaxEffectiveEnd = cDates.end;
                    }
                    const childDuration = getTaskDurationDays(child.startDate, child.plannedEndDate || child.endDate, child.delayDays);
                    const childProgress = parseInt(child.progress) || 0;
                    parentTotalWeightedProgressDays += childDuration * (childProgress / 100);
                    parentTotalDurationDays += childDuration;
                });

                parent.startDate = parentMinStart ? formatDateToISO(parentMinStart) : "";
                parent.plannedStartDate = parentMinPlannedStart ? formatDateToISO(parentMinPlannedStart) : parent.startDate;
                parent.plannedEndDate = parentMaxPlannedEnd ? formatDateToISO(parentMaxPlannedEnd) : "";
                parent.endDate = parentMaxEffectiveEnd ? formatDateToISO(parentMaxEffectiveEnd) : "";
                parent.progress = parentTotalDurationDays > 0 ? Math.round((parentTotalWeightedProgressDays / parentTotalDurationDays) * 100) : 0;
            });
        }

        function calculateTimelineRange() {
            let allDates = [];
            ganttData.forEach(parent => {
                if (parent.startDate) allDates.push(new Date(parent.startDate));
                if (parent.plannedStartDate) allDates.push(new Date(parent.plannedStartDate));
                if (parent.endDate) allDates.push(new Date(parent.endDate));
                parent.children.forEach(child => {
                    if (child.startDate) allDates.push(new Date(child.startDate));
                    const cd = getEffectiveTaskDates(child);
                    if (cd.start) allDates.push(cd.start);
                    if (cd.end) allDates.push(cd.end);
                    if (child.children) {
                        child.children.forEach(subchild => {
                            if (subchild.startDate) allDates.push(new Date(subchild.startDate));
                            const sd = getEffectiveTaskDates(subchild);
                            if (sd.start) allDates.push(sd.start);
                            if (sd.end) allDates.push(sd.end);
                        });
                    }
                });
            });

            milestones.forEach(ms => { if (ms.date) allDates.push(new Date(ms.date)); });

            if (allDates.length === 0) {
                const today = new Date();
                allDates.push(today);
                allDates.push(addDays(today, 30));
            }

            let minDate = new Date(Math.min(...allDates));
            let maxDate = new Date(Math.max(...allDates));

            if (timelineViewMode === 'week') {
                minDate = getMonday(minDate);
                maxDate = addDays(getMonday(maxDate), 7);
                projectStartDate = minDate;
                projectEndDate = addDays(maxDate, 7);
                weeksHeader = [];
                let curr = new Date(projectStartDate);
                while (curr < projectEndDate) {
                    const weekEnd = addDays(curr, 6);
                    weeksHeader.push({
                        label: `Sett. ${getWeekNumber(curr)}`,
                        rangeText: `${formatShortDate(curr)} - ${formatShortDate(weekEnd)}`,
                        startDate: new Date(curr),
                        endDate: weekEnd,
                        daysCount: 7
                    });
                    curr = addDays(curr, 7);
                }
            } else {
                minDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
                maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth() + 1, 0);
                projectStartDate = minDate;
                projectEndDate = maxDate;
                weeksHeader = [];
                let curr = new Date(minDate);
                while (curr <= maxDate) {
                    const monthName = curr.toLocaleDateString('it-IT', { month: 'short', year: '2-digit' });
                    const daysInMonth = new Date(curr.getFullYear(), curr.getMonth() + 1, 0).getDate();
                    weeksHeader.push({
                        label: monthName.toUpperCase(),
                        rangeText: `${daysInMonth} giorni`,
                        startDate: new Date(curr),
                        endDate: new Date(curr.getFullYear(), curr.getMonth(), daysInMonth),
                        daysCount: daysInMonth
                    });
                    curr = new Date(curr.getFullYear(), curr.getMonth() + 1, 1);
                }
            }
        }

        function renderGlobalBackgroundGrid(totalTimelineWidth) {
            const gridContainer = document.getElementById('ganttGridBackground');
            if (!gridContainer) return;
            const ganttTable = document.getElementById('ganttTable');
            const tableHeight = ganttTable ? ganttTable.offsetHeight : 0;

            gridContainer.style.left = `${leftColWidth}px`;
            gridContainer.style.width = `${totalTimelineWidth}px`;
            gridContainer.style.height = `${tableHeight}px`;

            let html = '';
            const today = new Date();
            const todayNormalized = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            if (timelineViewMode === 'week') {
                let totalDays = weeksHeader.length * WEEK_DAYS;
                const startNormalized = new Date(projectStartDate.getFullYear(), projectStartDate.getMonth(), projectStartDate.getDate());
                const diffDaysToday = Math.round((todayNormalized - startNormalized) / (1000 * 60 * 60 * 24));

                for (let d = 0; d < totalDays; d++) {
                    const leftPos = d * dayWidth;
                    if (d === diffDaysToday) html += `<div class="today-column-bg" style="left: ${leftPos}px; width: ${dayWidth}px;" title="Oggi"></div>`;
                    if (d === diffDaysToday || d === diffDaysToday + 1) html += `<div class="today-dotted-line" style="left: ${leftPos}px;" title="Oggi"></div>`;
                    else if (d > 0 && d % WEEK_DAYS === 0) html += `<div class="week-grid-line" style="left: ${leftPos}px;"></div>`;
                    else if (d > 0) html += `<div class="day-grid-line" style="left: ${leftPos}px;"></div>`;
                }
            } else {
                let currentLeft = 0;
                weeksHeader.forEach((col, idx) => {
                    for (let day = 0; day < col.daysCount; day++) {
                        const dayDate = addDays(col.startDate, day);
                        const dayLeft = currentLeft + (day * dayWidth);
                        if (dayDate.getTime() === todayNormalized.getTime()) {
                            html += `<div class="today-column-bg" style="left: ${dayLeft}px; width: ${dayWidth}px;" title="Oggi"></div>`;
                            html += `<div class="today-dotted-line" style="left: ${dayLeft}px;" title="Oggi"></div>`;
                        } else if (dayDate.getDay() === 1 && day > 0) {
                            html += `<div class="day-grid-line" style="left: ${dayLeft}px;" title="Inizio Settimana"></div>`;
                        }
                    }
                    if (idx > 0) html += `<div class="month-grid-line" style="left: ${currentLeft}px;"></div>`;
                    currentLeft += col.daysCount * dayWidth;
                });
            }

            milestones.forEach(ms => {
                if (!ms.date) return;
                const msDate = new Date(ms.date);
                const msNormalized = new Date(msDate.getFullYear(), msDate.getMonth(), msDate.getDate());
                const startNormalized = new Date(projectStartDate.getFullYear(), projectStartDate.getMonth(), projectStartDate.getDate());
                const diffDays = Math.round((msNormalized - startNormalized) / (1000 * 60 * 60 * 24));
                if (diffDays >= 0) {
                    const leftPos = diffDays * dayWidth;
                    html += `<div class="milestone-dotted-line" style="left: ${leftPos}px; border-color: ${ms.color || '#059669'};" title="Milestone: ${escapeHtml(ms.name)} (${formatShortDate(msDate)})"></div>`;
                }
            });

            gridContainer.innerHTML = html;
        }

        function renderGantt() {
            calculateRollups();
            calculateTimelineRange();

            const totalTimelineWidth = weeksHeader.reduce((sum, col) => sum + (col.daysCount * dayWidth), 0);
            const headerRow = document.getElementById('ganttHeaderRow');
            headerRow.innerHTML = `
                <th id="leftHeaderCol" class="sticky-col-header bg-slate-100 p-2.5 border-r border-slate-300 border-b border-slate-300 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]" style="width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;">
                    <div class="flex items-center justify-between pr-2">
                        <button id="editProjectNameBtn" onclick="editProjectName()" class="flex items-center space-x-2 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-200/60 transition-colors text-sm font-semibold group w-full justify-between" title="Modifica Nome">
                            <span id="projectNameDisplay" class="truncate">${escapeHtml(currentProjectName)}</span>
                            <i data-lucide="pencil" class="w-3.5 h-3.5 text-indigo-400 group-hover:text-indigo-600 transition-colors shrink-0"></i>
                        </button>
                    </div>
                    <div id="columnResizer" class="resizer-handle"></div>
                </th>
            `;

            weeksHeader.forEach(col => {
                const colWidth = col.daysCount * dayWidth;
                const th = document.createElement('th');
                th.className = "p-2 border-r border-b border-slate-300 text-center font-medium relative bg-slate-100";
                th.style.cssText = `width: ${colWidth}px; min-width: ${colWidth}px; max-width: ${colWidth}px;`;
                th.innerHTML = `
                    <div class="text-xs font-bold text-slate-700">${col.label}</div>
                    <div class="text-[10px] text-slate-400 font-normal">${col.rangeText}</div>
                    <div class="timeline-resizer-handle"></div>
                `;
                headerRow.appendChild(th);
            });

            const stickyHeader = document.getElementById('stickyHeaderContainer');
            stickyHeader.querySelectorAll('.milestone-badge-header').forEach(b => b.remove());

            milestones.forEach(ms => {
                if (!ms.date) return;
                const msDate = new Date(ms.date);
                const msNormalized = new Date(msDate.getFullYear(), msDate.getMonth(), msDate.getDate());
                const startNormalized = new Date(projectStartDate.getFullYear(), projectStartDate.getMonth(), projectStartDate.getDate());
                const diffDays = Math.round((msNormalized - startNormalized) / (1000 * 60 * 60 * 24));
                if (diffDays >= 0) {
                    const leftPos = leftColWidth + (diffDays * dayWidth);
                    const badge = document.createElement('div');
                    badge.className = "milestone-badge-header px-1.5 py-0.5 rounded text-[10px] font-bold text-white shadow-sm flex items-center space-x-1 cursor-pointer";
                    badge.style.cssText = `left: ${leftPos}px; background-color: ${ms.color || '#059669'};`;
                    badge.title = `Milestone: ${escapeHtml(ms.name)} - ${formatShortDate(msDate)}`;
                    badge.onclick = () => openMilestonesModal();
                    badge.innerHTML = `<i data-lucide="flag" class="w-3 h-3"></i><span>${escapeHtml(ms.name)}</span>`;
                    stickyHeader.appendChild(badge);
                }
            });

            const tbody = document.getElementById('ganttBody');
            tbody.innerHTML = "";

            const query = searchQuery ? searchQuery.toLowerCase().trim() : "";
            const filteredData = ganttData.filter(parent => {
                const pMatch = parent.title.toLowerCase().includes(query);
                const cMatch = parent.children && parent.children.some(c => c.title.toLowerCase().includes(query) || (c.children && c.children.some(s => s.title.toLowerCase().includes(query))));
                return pMatch || cMatch;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${weeksHeader.length + 1}" class="text-center py-12 text-slate-400"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="text-sm font-medium">Nessuna attività trovata.</p></td></tr>`;
                lucide.createIcons();
                return;
            }

            filteredData.forEach((parent, parentIdx) => {
                const hexColor = parent.color || "#4f46e5";
                const solidBg = getSolidTint(hexColor, (parent.bgOpacity || 15) / 100);
                const parentDateStr = (parent.startDate && parent.endDate) ? `${formatShortDate(new Date(parent.startDate))} - ${formatShortDate(new Date(parent.endDate))}` : '';

                // --- LIVELLO 1: RIGA GENITORE ---
                const parentRow = document.createElement('tr');
                parentRow.className = "hover:brightness-95 transition-all group";

                const sidebarCell = document.createElement('td');
                sidebarCell.className = "sticky-col px-2.5 py-1.5 font-semibold text-slate-800 border-r border-b border-slate-300 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]";
                sidebarCell.style.cssText = `background-color: ${solidBg}; border-top: 4px solid ${hexColor}; width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;`;
                sidebarCell.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    document.querySelectorAll('.sticky-col').forEach(el => el.classList.remove('ring-2', 'ring-indigo-500'));
                    selectedTaskId = parent.id; selectedTaskLevel = 1;
                    sidebarCell.classList.add('ring-2', 'ring-indigo-500');
                });

                sidebarCell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 overflow-hidden mr-2">
                            <button onclick="toggleExpand('${parent.id}', 1)" class="text-slate-500 hover:text-slate-800 p-1 rounded">
                                <i data-lucide="${parent.expanded ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4"></i>
                            </button>
                            <span class="truncate text-sm font-semibold" title="${escapeHtml(parent.title)}">${escapeHtml(parent.title)}</span>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="text-right flex flex-col justify-center">
                                <span class="text-[10px] text-slate-500 font-medium leading-tight">${parentDateStr}</span>
                                <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-white/70 text-slate-700 border border-slate-200/50">${parent.progress}%</span>
                            </div>
                            <div class="action-buttons flex items-center space-x-1 border-l border-slate-200/60 pl-2">
                                <button onclick="moveParent('${parent.id}', 'up')" ${parentIdx === 0 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-600"'}><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
                                <button onclick="moveParent('${parent.id}', 'down')" ${parentIdx === filteredData.length - 1 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-600"'}><i data-lucide="arrow-down" class="w-3.5 h-3.5"></i></button>
                                <button onclick="duplicateParent('${parent.id}')" class="p-1 hover:bg-indigo-100 text-indigo-600 rounded"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                                <button onclick="addChildTask('${parent.id}')" class="p-1 hover:bg-indigo-100 text-indigo-600 rounded"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                <button onclick="openEditModal('${parent.id}', 1)" class="p-1 hover:bg-slate-200/60 rounded text-slate-600"><i data-lucide="settings" class="w-3.5 h-3.5"></i></button>
                                <button onclick="promptDelete('${parent.id}', 1)" class="p-1 hover:bg-red-100 text-red-600 rounded"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                parentRow.appendChild(sidebarCell);

                const timelineCell = document.createElement('td');
                timelineCell.colSpan = weeksHeader.length;
                timelineCell.className = "p-0 relative h-12 border-b border-slate-300";
                timelineCell.style.cssText = `border-top: 4px solid ${hexColor}; width: ${totalTimelineWidth}px; min-width: ${totalTimelineWidth}px; max-width: ${totalTimelineWidth}px;`;

                if (parent.startDate && parent.endDate) {
                    const plannedEnd = parent.plannedEndDate || parent.endDate;
                    const hasParentDelay = new Date(parent.endDate) > new Date(plannedEnd);
                    const basePos = calculateBarPosition(parent.startDate, plannedEnd);
                    const origBasePos = calculateBarPosition(parent.plannedStartDate || parent.startDate, plannedEnd);

                    const baselineParentBar = document.createElement('div');
                    baselineParentBar.className = "baseline-bar-parent";
                    baselineParentBar.style.cssText = `left: ${origBasePos.left}px; width: ${origBasePos.width}px;`;
                    timelineCell.appendChild(baselineParentBar);

                    if (hasParentDelay) {
                        const effectivePos = calculateBarPosition(parent.startDate, parent.endDate);
                        const delayWidth = effectivePos.width - basePos.width;
                        const delayLeft = basePos.left + basePos.width;
                        const delayBarHtml = `<div class="absolute h-6 top-2.5 rounded-r-md bg-amber-500 border-t border-b border-r border-amber-600 flex items-center justify-center shadow-sm cursor-pointer z-10" style="left: ${delayLeft}px; width: ${delayWidth}px;" data-delay-info="Ritardo gruppo: Fine effettiva ${formatShortDate(new Date(parent.endDate))}"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-white"></i></div>`;
                        timelineCell.insertAdjacentHTML('beforeend', delayBarHtml);
                    }

                    const parentBar = document.createElement('div');
                    parentBar.className = "absolute h-6 top-2.5 rounded-md shadow-sm border-2 border-slate-900/40 overflow-hidden flex items-center cursor-move z-10";
                    parentBar.style.cssText = `left: ${basePos.left}px; width: ${basePos.width}px; background-color: ${hexColor}; ${hasParentDelay ? 'border-top-right-radius: 0; border-bottom-right-radius: 0;' : ''}`;
                    parentBar.innerHTML = `<div class="h-full bg-black/20 pointer-events-none" style="width: ${parent.progress}%;"></div><span class="absolute inset-0 flex items-center justify-center text-[11px] font-bold text-white px-2 truncate pointer-events-none">${parent.progress}% (${formatShortDate(new Date(parent.startDate))} - ${formatShortDate(new Date(parent.endDate))})</span>`;

                    timelineCell.appendChild(parentBar);
                    attachDragEvents(parentBar, parent, 1);
                }

                parentRow.appendChild(timelineCell);
                tbody.appendChild(parentRow);

                // --- LIVELLO 2 & 3: FIGLI E NIPOTI ---
                if ((parent.expanded || query) && parent.children) {
                    parent.children.forEach((child, childIdx) => {
                        const hasSubchildren = child.children && child.children.length > 0;
                        const childRow = document.createElement('tr');
                        childRow.className = "hover:brightness-95 transition-all";

                        const childSidebar = document.createElement('td');
                        childSidebar.className = "sticky-col p-2 pl-6 text-xs font-semibold text-slate-700 border-r border-b border-slate-300 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]";
                        childSidebar.style.cssText = `background-color: ${solidBg}; width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;`;
                        childSidebar.addEventListener('click', (e) => {
                            if (e.target.closest('button')) return;
                            document.querySelectorAll('.sticky-col').forEach(el => el.classList.remove('ring-2', 'ring-indigo-500'));
                            selectedTaskId = child.id; selectedTaskLevel = 2;
                            childSidebar.classList.add('ring-2', 'ring-indigo-500');
                        });

                        const slipDays = hasSubchildren ? 0 : (child.slipDays || 0);
                        const delayDays = hasSubchildren ? 0 : (child.delayDays || 0);
                        const childEffDates = getEffectiveTaskDates(child);

                        childSidebar.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                                    <button onclick="toggleExpand('${child.id}', 2)" class="text-slate-500 p-0.5 rounded ${hasSubchildren ? '' : 'invisible'}">
                                        <i data-lucide="${child.expanded !== false ? 'chevron-down' : 'chevron-right'}" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <i data-lucide="corner-down-right" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                    <span class="truncate font-medium" title="${escapeHtml(child.title)}">${escapeHtml(child.title)}</span>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <div class="text-right flex flex-col justify-center">
                                        <span class="text-[9px] text-slate-400 font-medium leading-tight">${child.startDate ? formatShortDate(addDays(new Date(child.startDate), slipDays)) : ''} - ${child.endDate ? formatShortDate(childEffDates.end) : ''}</span>
                                        <span class="text-[10px] text-slate-500 font-semibold">${child.progress}%</span>
                                    </div>
                                    <div class="action-buttons flex items-center space-x-1 border-l border-slate-200/60 pl-2">
                                        <button onclick="moveChild('${parent.id}', '${child.id}', 'up')" ${childIdx === 0 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 text-slate-500"'}><i data-lucide="arrow-up" class="w-3 h-3"></i></button>
                                        <button onclick="moveChild('${parent.id}', '${child.id}', 'down')" ${childIdx === parent.children.length - 1 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 text-slate-500"'}><i data-lucide="arrow-down" class="w-3 h-3"></i></button>
                                        <button onclick="duplicateChild('${parent.id}', '${child.id}')" class="p-1 text-indigo-600"><i data-lucide="copy" class="w-3 h-3"></i></button>
                                        <button onclick="addSubchildTask('${parent.id}', '${child.id}')" class="p-1 text-indigo-600"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                                        <button onclick="openEditModal('${child.id}', 2)" class="p-1 text-slate-500"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
                                        <button onclick="promptDelete('${child.id}', 2)" class="p-1 text-red-500"><i data-lucide="trash" class="w-3 h-3"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                        childRow.appendChild(childSidebar);

                        const childTimeline = document.createElement('td');
                        childTimeline.colSpan = weeksHeader.length;
                        childTimeline.className = "p-0 relative h-10 border-b border-slate-300";
                        childTimeline.style.cssText = `width: ${totalTimelineWidth}px; min-width: ${totalTimelineWidth}px; max-width: ${totalTimelineWidth}px;`;

                        if (child.startDate && child.endDate) {
                            const plannedEnd = child.plannedEndDate || child.endDate;
                            const origStart = new Date(child.startDate);
                            const origEnd = new Date(plannedEnd);

                            const origBasePos = calculateBarPosition(child.startDate, plannedEnd);
                            const baselineChildBar = document.createElement('div');
                            baselineChildBar.className = "baseline-bar";
                            baselineChildBar.style.cssText = `left: ${origBasePos.left}px; width: ${origBasePos.width}px;`;
                            childTimeline.appendChild(baselineChildBar);

                            const effectiveStart = addDays(origStart, slipDays);
                            const effectivePlannedEnd = addDays(origEnd, slipDays);
                            const basePos = calculateBarPosition(formatDateToISO(effectiveStart), formatDateToISO(effectivePlannedEnd));

                            const taskBar = document.createElement('div');
                            taskBar.className = "absolute h-6 top-2 rounded-md shadow-sm border border-slate-800/10 flex items-center justify-between cursor-move z-10";
                            taskBar.style.cssText = `left: ${basePos.left}px; width: ${basePos.width}px; background-color: ${hexColor};`;

                            taskBar.innerHTML = `
                                <div class="w-2 h-full cursor-ew-resize hover:bg-white/30 rounded-l-md" data-handle="left"></div>
                                <div class="flex-1 h-full relative overflow-hidden flex items-center pointer-events-none">
                                    <div class="h-full bg-black/20" style="width: ${child.progress}%;"></div>
                                    <span class="absolute inset-0 flex items-center justify-center px-2 text-[10px] font-medium text-white truncate">${child.progress}%</span>
                                </div>
                                <div class="w-2 h-full cursor-ew-resize hover:bg-white/30 rounded-r-md" data-handle="right"></div>
                            `;
                            childTimeline.appendChild(taskBar);
                            attachDragEvents(taskBar, child, 2, parent.id);
                        }

                        childRow.appendChild(childTimeline);
                        tbody.appendChild(childRow);

                        // LIVELLO 3 (Subchildren)
                        if ((child.expanded !== false || query) && child.children) {
                            child.children.forEach((subchild, subIdx) => {
                                const subRow = document.createElement('tr');
                                subRow.className = "hover:brightness-95 transition-all";

                                const subSidebar = document.createElement('td');
                                subSidebar.className = "sticky-col p-1.5 pl-16 text-[11px] text-slate-600 border-r border-b border-slate-300 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]";
                                subSidebar.style.cssText = `background-color: ${solidBg}; width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;`;
                                subSidebar.addEventListener('click', (e) => {
                                    if (e.target.closest('button')) return;
                                    document.querySelectorAll('.sticky-col').forEach(el => el.classList.remove('ring-2', 'ring-indigo-500'));
                                    selectedTaskId = subchild.id; selectedTaskLevel = 3;
                                    subSidebar.classList.add('ring-2', 'ring-indigo-500');
                                });

                                subSidebar.innerHTML = `
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                                            <i data-lucide="corner-down-right" class="w-3 h-3 text-slate-400 shrink-0"></i>
                                            <span class="truncate" title="${escapeHtml(subchild.title)}">${escapeHtml(subchild.title)}</span>
                                        </div>
                                        <div class="flex items-center space-x-2 shrink-0">
                                            <span class="text-[9px] text-slate-400 font-semibold">${subchild.progress}%</span>
                                            <div class="action-buttons flex items-center space-x-1 border-l border-slate-200/60 pl-2">
                                                <button onclick="moveSubchild('${parent.id}', '${child.id}', '${subchild.id}', 'up')" ${subIdx === 0 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-0.5 text-slate-500"'}><i data-lucide="arrow-up" class="w-3 h-3"></i></button>
                                                <button onclick="moveSubchild('${parent.id}', '${child.id}', '${subchild.id}', 'down')" ${subIdx === child.children.length - 1 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-0.5 text-slate-500"'}><i data-lucide="arrow-down" class="w-3 h-3"></i></button>
                                                <button onclick="duplicateSubchild('${parent.id}', '${child.id}', '${subchild.id}')" class="p-0.5 text-indigo-600"><i data-lucide="copy" class="w-3 h-3"></i></button>
                                                <button onclick="openEditModal('${subchild.id}', 3)" class="p-0.5 text-slate-500"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
                                                <button onclick="promptDelete('${subchild.id}', 3)" class="p-0.5 text-red-500"><i data-lucide="trash" class="w-3 h-3"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                subRow.appendChild(subSidebar); // <-- CORRETTO! Prima era sidebarCell

                                const subTimeline = document.createElement('td');
                                subTimeline.colSpan = weeksHeader.length;
                                subTimeline.className = "p-0 relative h-9 border-b border-slate-300";
                                subTimeline.style.cssText = `width: ${totalTimelineWidth}px; min-width: ${totalTimelineWidth}px; max-width: ${totalTimelineWidth}px;`;

                                if (subchild.startDate && subchild.endDate) {
                                    const subBasePos = calculateBarPosition(subchild.startDate, subchild.endDate);
                                    const subTaskBar = document.createElement('div');
                                    subTaskBar.className = "absolute h-5 top-2 rounded-md shadow-sm border border-slate-800/10 flex items-center justify-between cursor-move z-10";
                                    subTaskBar.style.cssText = `left: ${subBasePos.left}px; width: ${subBasePos.width}px; background-color: ${hexColor}; opacity: 0.9;`;
                                    subTaskBar.innerHTML = `
                                        <div class="w-1.5 h-full cursor-ew-resize hover:bg-white/30 rounded-l-md" data-handle="left"></div>
                                        <div class="flex-1 h-full relative overflow-hidden flex items-center pointer-events-none">
                                            <div class="h-full bg-black/20" style="width: ${subchild.progress}%;"></div>
                                            <span class="absolute inset-0 flex items-center justify-center px-1 text-[9px] text-white truncate">${subchild.progress}%</span>
                                        </div>
                                        <div class="w-1.5 h-full cursor-ew-resize hover:bg-white/30 rounded-r-md" data-handle="right"></div>
                                    `;
                                    subTimeline.appendChild(subTaskBar);
                                    attachDragEvents(subTaskBar, subchild, 3, parent.id, child.id);
                                }

                                subRow.appendChild(subTimeline);
                                tbody.appendChild(subRow);
                            });
                        }
                    });
                }
            });

            renderGlobalBackgroundGrid(totalTimelineWidth);
            lucide.createIcons();
            setupTooltips();
        }

        /* --- UTILITY & DIALOG LOGIC --- */
        function openMilestonesModal() { renderMilestonesList(); document.getElementById('milestonesModal').classList.remove('hidden'); }
        function closeMilestonesModal() { document.getElementById('milestonesModal').classList.add('hidden'); }
        function renderMilestonesList() {
            const container = document.getElementById('milestonesListContainer');
            if (!container) return;
            if (milestones.length === 0) { container.innerHTML = `<p class="text-xs text-slate-400 italic">Nessuna milestone definita.</p>`; return; }
            let html = '';
            milestones.forEach(ms => {
                html += `
                    <div class="flex items-center justify-between p-2.5 bg-white border border-slate-200 rounded-lg shadow-sm">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-3.5 h-3.5 rounded-full shrink-0" style="background-color: ${ms.color || '#059669'};"></span>
                            <span class="text-sm font-semibold text-slate-800">${escapeHtml(ms.name)}</span>
                            <span class="text-xs text-slate-500">(${ms.date ? formatShortDate(new Date(ms.date)) : ''})</span>
                        </div>
                        <button onclick="removeMilestone('${ms.id}')" class="text-red-500 hover:bg-red-50 p-1 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function addMilestoneFromModal() {
            const name = document.getElementById('newMsName').value.trim();
            const date = document.getElementById('newMsDate').value;
            const color = document.getElementById('newMsColor').value || "#059669";
            if (!name || !date) { alert("Inserisci sia nome che data."); return; }
            pushState();
            milestones.push({ id: 'ms-' + Date.now(), name, date, color });
            document.getElementById('newMsName').value = '';
            document.getElementById('newMsDate').value = '';
            saveGanttData(); renderMilestonesList(); renderGantt();
        }

        function removeMilestone(id) { pushState(); milestones = milestones.filter(m => m.id !== id); saveGanttData(); renderMilestonesList(); renderGantt(); }

        function setupColumnResizer() {
            const stickyHeader = document.getElementById('stickyHeaderContainer');
            if (!stickyHeader) return;
            let isResizing = false, startX = 0, startWidth = 0;
            stickyHeader.addEventListener('mousedown', (e) => {
                const resizer = e.target.closest('#columnResizer');
                if (!resizer) return;
                isResizing = true; startX = e.clientX; startWidth = leftColWidth;
                resizer.classList.add('resizing'); document.body.style.cursor = 'col-resize';
                const onMouseMove = (moveEvent) => {
                    if (!isResizing) return;
                    leftColWidth = Math.max(280, Math.min(1000, startWidth + (moveEvent.clientX - startX)));
                    document.querySelectorAll('.sticky-col, .sticky-col-header').forEach(el => { el.style.width = `${leftColWidth}px`; el.style.minWidth = `${leftColWidth}px`; el.style.maxWidth = `${leftColWidth}px`; });
                    const gridContainer = document.getElementById('ganttGridBackground');
                    if (gridContainer) gridContainer.style.left = `${leftColWidth}px`;
                };
                const onMouseUp = () => {
                    if (!isResizing) return;
                    isResizing = false; resizer.classList.remove('resizing'); document.body.style.cursor = 'default';
                    localStorage.setItem('gantt_left_col_width_v1', leftColWidth);
                    document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp);
                };

                resizer.classList.add('resizing'); document.body.style.cursor = 'col-resize';
                const onMouseMove = (moveEvent) => {
                    if (!isResizing) return;
                    dayWidth = Math.max(3, Math.min(60, startDayWidth + ((moveEvent.clientX - startX) / (timelineViewMode === 'week' ? WEEK_DAYS : 30))));
                    renderGantt();
                };
                const onMouseUp = () => {
                    if (!isResizing) return;
                    isResizing = false; resizer.classList.remove('resizing'); document.body.style.cursor = 'default';
                    if (timelineViewMode === 'week') localStorage.setItem('gantt_day_width_week', dayWidth);
                    else localStorage.setItem('gantt_day_width_month', dayWidth);
                    document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp);

        function calculateBarPosition(startDateStr, endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            const diffStartDays = Math.max(0, Math.round((start - projectStartDate) / (1000 * 60 * 60 * 24)));
            const durationDays = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1);
            return { left: diffStartDays * dayWidth, width: durationDays * dayWidth };
        }

        function shiftTaskHierarchy(taskItem, daysDelta) {
            if (daysDelta === 0) return;
            if (taskItem.startDate) taskItem.startDate = formatDateToISO(addDays(new Date(taskItem.startDate), daysDelta));
            if (taskItem.endDate) taskItem.endDate = formatDateToISO(addDays(new Date(taskItem.endDate), daysDelta));
            if (taskItem.plannedEndDate) taskItem.plannedEndDate = formatDateToISO(addDays(new Date(taskItem.plannedEndDate), daysDelta));
            if (taskItem.children) taskItem.children.forEach(c => shiftTaskHierarchy(c, daysDelta));
        }

        function attachDragEvents(barElem, taskItem, level, parentId, childId) {
            let isDragging = false, isResizingLeft = false, isResizingRight = false;
            let startX = 0, initialLeft = 0, initialWidth = 0;
            const hasChildren = taskItem.children && taskItem.children.length > 0;

            const onMouseDown = (e) => {
                const handle = e.target.getAttribute('data-handle');
                if (handle === 'left' && !hasChildren) isResizingLeft = true;
                else if (handle === 'right' && !hasChildren) isResizingRight = true;
                else isDragging = true;

                startX = e.clientX;
                initialLeft = parseFloat(barElem.style.left) || 0;
                initialWidth = parseFloat(barElem.style.width) || dayWidth;
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;
                const daysDelta = Math.round((e.clientX - startX) / dayWidth);
                if (isDragging) {
                    barElem.style.left = `${Math.max(0, initialLeft + (daysDelta * dayWidth))}px`;
                } else if (isResizingRight) {
                    barElem.style.width = `${Math.max(dayWidth, initialWidth + (daysDelta * dayWidth))}px`;
                } else if (isResizingLeft) {
                    const clampedDays = Math.min(daysDelta, initialWidth / dayWidth - 1);
                    barElem.style.left = `${Math.max(0, initialLeft + (clampedDays * dayWidth))}px`;
                    barElem.style.width = `${Math.max(dayWidth, initialWidth - (clampedDays * dayWidth))}px`;
                }
            };

            const onMouseUp = () => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;
                pushState();
                const finalLeft = parseFloat(barElem.style.left);
                const finalWidth = parseFloat(barElem.style.width);

                if (hasChildren && isDragging) {
                    const daysShift = Math.round((finalLeft - initialLeft) / dayWidth);
                    if (daysShift !== 0) shiftTaskHierarchy(taskItem, daysShift);
                } else {
                    const startDaysOffset = Math.round(finalLeft / dayWidth);
                    const durationDays = Math.round(finalWidth / dayWidth);
                    const slip = parseInt(taskItem.slipDays) || 0;
                    const newStart = addDays(projectStartDate, startDaysOffset - slip);
                    const newEnd = addDays(newStart, durationDays - 1);
                    taskItem.startDate = formatDateToISO(newStart);
                    taskItem.endDate = formatDateToISO(newEnd);
                    if (taskItem.plannedEndDate) taskItem.plannedEndDate = formatDateToISO(newEnd);
                }

                isDragging = false; isResizingLeft = false; isResizingRight = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                saveGanttData(); renderGantt();
            };

            barElem.addEventListener('mousedown', onMouseDown);
        }

                            ganttData = rawData;
                            if (rawName) { currentProjectName = rawName; updateProjectNameUI(); }
                            saveGanttData(); renderGantt();
                        } catch (err) { alert("File JSON non valido."); }
                    };
                    reader.readAsText(file);
                });
            }
        }

        document.addEventListener('keydown', (e) => {
            const isInputActive = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
            const isCtrlOrMeta = e.ctrlKey || e.metaKey;
            if (isCtrlOrMeta && e.key.toLowerCase() === 's') { e.preventDefault(); document.getElementById('exportBtn').click(); return; }
            if (isCtrlOrMeta && e.key.toLowerCase() === 'f') { e.preventDefault(); const s = document.getElementById('searchInput'); s.focus(); s.select(); return; }
            if (isInputActive) return;
            if (isCtrlOrMeta && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? performRedo() : performUndo(); }
            else if (isCtrlOrMeta && e.key.toLowerCase() === 'y') { e.preventDefault(); performRedo(); }
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedTaskId && selectedTaskLevel) { e.preventDefault(); promptDelete(selectedTaskId, selectedTaskLevel); }
        });

        function formatDateToISO(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        function formatShortDate(date) {
            return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}`;
        }
        function addDays(date, days) {
            const res = new Date(date); res.setDate(res.getDate() + days); return res;
        }
        function getMonday(d) {
            const date = new Date(d); const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }
        function getWeekNumber(d) {
            const target = new Date(d.valueOf());
            target.setHours(0, 0, 0, 0);
            target.setDate(target.getDate() + 3 - (target.getDay() + 6) % 7);
            const yearStart = new Date(target.getFullYear(), 0, 1);
            return Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
        }
        function shiftEntireProject() {
            showCustomPrompt("Numero di giorni di spostamento (+ per avanti, - per indietro):", "120", (inputVal) => {
                const daysDelta = parseInt(inputVal, 10);
                if (isNaN(daysDelta) || daysDelta === 0) return;
                pushState();
                ganttData.forEach(parent => shiftTaskHierarchy(parent, daysDelta));
                milestones.forEach(ms => { if (ms.date) ms.date = formatDateToISO(addDays(new Date(ms.date), daysDelta)); });
                saveGanttData(); renderGantt();
            });
        }
        function getSolidTint(hex, opacity) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            return `#${((1 << 24) + (Math.round(r * opacity + 255 * (1 - opacity)) << 16) + (Math.round(g * opacity + 255 * (1 - opacity)) << 8) + Math.round(b * opacity + 255 * (1 - opacity))).toString(16).slice(1)}`;
        }
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
