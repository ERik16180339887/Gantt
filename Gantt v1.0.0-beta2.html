<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramma di Gantt Interattivo (v1.0.0-beta2)</title>
    
    <!-- Tailwind CSS (Styling Utility Framework) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (Icon set) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 
      CUSTOM CSS STYLES / STILI CSS PERSONALIZZATI
      Gestisce la griglia, i posizionamenti fissi (sticky), le scrollbar e gli elementi di layout.
      Manages grid styling, sticky positioning, custom scrollbars, and layout elements.
    -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        
        /* Custom scrollbars for clean look / Barre di scorrimento personalizzate */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Lock Table Layout so columns respect exact widths / Blocca il layout della tabella */
        #ganttTable {
            table-layout: fixed;
            width: max-content;
        }

        /* Fixed Left Column positioning / Posizionamento colonna sinistra fissa (Sticky) */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        /* Intestazione WBS: fisso in alto e a sinistra con z-index massimo */
        .sticky-col-header {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 50 !important;
        }
        /* Intestazione Settimane: fisso in alto */
        .timeline-col-header {
            position: sticky;
            top: 0;
            z-index: 30 !important;
        }

        /* Resizable Handle on Right Border for Sidebar / Maniglia di ridimensionamento sidebar */
        .resizer-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            z-index: 55;
        }
        .resizer-handle:hover, .resizer-handle.resizing {
            background-color: #6366f1;
        }

        /* Timeline Column Resizer Handle / Maniglia di zoom/ridimensionamento giorni timeline */
        .timeline-resizer-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            user-select: none;
            z-index: 35;
        }
        .timeline-resizer-handle:hover, .timeline-resizer-handle.resizing {
            background-color: #6366f1;
        }

        /* Grid lines for days and weeks / Linee della griglia per giorni e settimane */
        .day-grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px dotted #bbbbbb;
            pointer-events: none;
        }
        .week-grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 1px solid #cbd5e1;
            pointer-events: none;
            z-index: 5;
        }

        /* Today Dotted Line & Highlight Area / Linea puntata e sfondo evidenziato per il giorno odierno */
        .today-dotted-line {
            position: absolute;
            top: 0;
            bottom: 0;
            border-right: 2px dotted #ef4444;
            pointer-events: none;
            z-index: 12;
        }
        .today-column-bg {
            position: absolute;
            top: 0;
            bottom: 0;
            background-color: rgba(239, 68, 68, 0.08);
            pointer-events: none;
            z-index: 4;
        }
		
		/* Nasconde i pulsanti d'azione in Modalità Vista */
        body.view-mode .action-buttons {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 
      TOP HEADER / TOOLBAR
      Barra superiore contenente branding, nome progetto modificabile e azioni globali (Salva, Importa, Esporta).
      Top bar containing branding, editable project name, and global action buttons.
    -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Gestione Progetti Gantt</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded border border-indigo-200">v1.0.0-beta4</span>
                    <span class="text-slate-300 font-light">|</span>
                    <!-- Project Name Badge / Pulsante nome progetto -->
                    <button id="editProjectNameBtn" class="flex items-center space-x-1.5 px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-200/60 transition-colors text-sm font-semibold group" title="Clicca per modificare il nome del progetto / Click to edit project name">
                        <span id="projectNameDisplay">Nuovo Progetto</span>
                        <i data-lucide="pencil" class="w-3.5 h-3.5 text-indigo-400 group-hover:text-indigo-600 transition-colors"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">Pianificazione e condivisione file singolo (Licenza GNU GPLv3 / Single-file sharing under GNU GPLv3)</p>
            </div>
        </div>

        <!-- SEARCH AND GLOBAL ACTIONS / Ricerca e comandi globali -->
        <div class="flex items-center flex-wrap gap-3">
            <!-- Search Input / Casella di ricerca attività -->
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Cerca attività... / Search tasks..." 
                    class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-40 lg:w-56 transition-all">
            </div>

			<!-- Pulsante Modalità Vista / Modifica -->
			<button id="toggleEditModeBtn" onclick="toggleEditMode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Attiva/Disattiva Modalità Modifica">
				<i data-lucide="eye" id="toggleEditIcon" class="w-4 h-4 text-indigo-600"></i>
				<span id="toggleEditText">Modalità Vista</span>
			</button>
			
            <!-- Add Root Parent Button / Pulsante aggiungi gruppo principale -->
            <button id="addParentBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors">
                <i data-lucide="folder-plus" class="w-4 h-4"></i>
                <span>Nuovo Gruppo</span>
            </button>

            <div class="h-6 w-px bg-slate-200 mx-1"></div>

            <!-- Export Standalone HTML / Esporta HTML unico standalone -->
            <button id="exportHtmlBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 shadow-sm transition-colors" title="Genera un singolo file HTML con nome personalizzato / Export standalone HTML">
                <i data-lucide="file-code" class="w-4 h-4"></i>
                <span>Esporta HTML Unico</span>
            </button>

            <!-- Export JSON / Salva dati JSON -->
            <button id="exportBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Esporta Dati JSON / Export JSON backup">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Salva</span>
            </button>

            <!-- Import JSON / Importa dati esterni -->
            <label class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors cursor-pointer" title="Importa Dati JSON / Import JSON data">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Importa</span>
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>

            <!-- Clear & Reset Buttons / Pulsanti pulizia e ripristino -->
            <button id="clearBtn" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Svuota Tutto / Clear All">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button id="resetBtn" class="bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition-colors" title="Ripristina Esempio / Reset Demo">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- MAIN GANTT CONTAINER / Contenitore principale della tabella -->
    <main class="flex-1 p-4 md:p-6 overflow-hidden flex flex-col">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
            
            <!-- GANTT SCROLL AREA / Area scrollabile della tabella e della timeline -->
            <div id="ganttScrollContainer" class="flex-1 overflow-auto relative">
                <table id="ganttTable" class="border-collapse text-left">
                    <!-- Table Header / Intestazione della tabella -->
                    <thead class="border-b border-slate-200 text-xs text-slate-600 font-semibold">
                        <tr id="ganttHeaderRow">
                            <!-- Left Sidebar Header / Intestazione colonna sinistra (Rimosso 'relative' per evitare conflitti con 'sticky') -->
                            <th id="leftHeaderCol" class="sticky-col-header bg-slate-100 p-3 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                                <div class="flex items-center justify-between pr-2">
                                    <span>Struttura Attività (WBS)</span>
                                    <span class="text-[10px] text-slate-400 font-normal">Livelli 1 - 2 - 3</span>
                                </div>
                                <div id="columnResizer" class="resizer-handle" title="Trascina per regolare la larghezza / Drag to resize column"></div>
                            </th>
                            <!-- Dynamic Timeline Weeks Columns generated here / Colonne timeline generate dinamicamente via JS -->
                        </tr>
                    </thead>
                    <!-- Table Body / Corpo della tabella -->
                    <tbody id="ganttBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Rows rendered dynamically via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- 
      CUSTOM EDIT TASK MODAL / Modale di modifica attività e gruppi
      Permette di modificare titolo, date, ritardi, % di avanzamento ponderato e colori personalizzati.
    -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 id="modalTitle" class="font-semibold text-slate-800 text-base">Modifica Attività</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="editForm" class="p-5 space-y-4">
                <input type="hidden" id="editTaskId">
                <input type="hidden" id="editTaskLevel">
                
                <!-- Task Title / Nome attività -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nome Attività</label>
                    <input type="text" id="editTaskTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Date Range / Intervallo date -->
                <div id="dateInputsGroup" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Inizio</label>
                        <input type="date" id="editStartDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Data Fine</label>
                        <input type="date" id="editEndDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <!-- Delay Days / Giorni di ritardo extra e motivazione -->
                <div id="delayDaysGroup" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Giorni di Ritardo Extra</label>
                        <input type="number" id="editDelayDays" min="0" max="90" value="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Causa / Nota Ritardo</label>
                        <input type="text" id="editDelayReason" placeholder="Es. Attesa materiale..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <!-- Completion Progress % / Avanzamento percentuale -->
                <div id="progressInputGroup">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Avanzamento (%): <span id="progressValue" class="text-indigo-600 font-bold">0%</span></label>
                    </div>
                    <input type="range" id="editProgress" min="0" max="100" step="5" class="w-full accent-indigo-600 cursor-pointer">
                </div>

                <!-- Color Options (Level 1 Only) / Opzioni colore e opacità per il gruppo principale -->
                <div id="colorPickerGroup" class="space-y-3 pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Colore Gruppo Genitore</label>
                    
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="setPresetColor('#4f46e5')" class="w-7 h-7 rounded-full bg-indigo-600 border-2 border-white ring-2 ring-transparent hover:ring-indigo-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#059669')" class="w-7 h-7 rounded-full bg-emerald-600 border-2 border-white ring-2 ring-transparent hover:ring-emerald-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#d97706')" class="w-7 h-7 rounded-full bg-amber-600 border-2 border-white ring-2 ring-transparent hover:ring-amber-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#dc2626')" class="w-7 h-7 rounded-full bg-red-600 border-2 border-white ring-2 ring-transparent hover:ring-red-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#2563eb')" class="w-7 h-7 rounded-full bg-blue-600 border-2 border-white ring-2 ring-transparent hover:ring-blue-300 transition-all"></button>
                        <button type="button" onclick="setPresetColor('#7c3aed')" class="w-7 h-7 rounded-full bg-purple-600 border-2 border-white ring-2 ring-transparent hover:ring-purple-300 transition-all"></button>
                        
                        <div class="flex items-center space-x-1.5 ml-auto">
                            <span class="text-xs text-slate-500">Custom:</span>
                            <input type="color" id="editColorHex" class="w-8 h-8 rounded border border-slate-200 cursor-pointer p-0 bg-transparent">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs text-slate-600 font-medium">Opacità Evidenziazione Riga: <span id="opacityValue" class="font-bold text-slate-800">15%</span></label>
                        </div>
                        <input type="range" id="editOpacity" min="5" max="50" step="1" class="w-full accent-indigo-600 cursor-pointer">
                    </div>
                </div>

                <!-- Form Action Buttons / Pulsanti azione modale -->
                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm">Salva Modifiche</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 
      CUSTOM CONFIRM DELETE MODAL / Modale di conferma eliminazione
      Previene cancellazioni accidentali di gruppi o sotto-attività.
    -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md p-6 text-center">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Conferma Eliminazione</h3>
            <p id="deleteModalMessage" class="text-sm text-slate-600 mb-6">Sei sicuro di voler eliminare questa attività?</p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeDeleteModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 shadow-sm">Elimina</button>
            </div>
        </div>
    </div>

    <!-- TOOLTIP OVERLAY CONTAINER / Contenitore per tooltip informativi sui ritardi -->
    <div id="customTooltip" class="fixed hidden z-50 bg-slate-900 text-white text-xs rounded-lg shadow-xl p-3 max-w-xs pointer-events-none transition-opacity duration-150"></div>

    <!-- 
      MAIN JAVASCRIPT LOGIC / LOGICA JAVASCRIPT PRINCIPALE
      Gestisce WBS a 3 livelli, ricalcoli ponderati sui giorni, duplicazione alberi, drag & drop, zoom temporale e persistenza.
    -->
    <script>
        /**
         * Global Constants and State / Costanti e Stato Globale
         * DEFAULT_DATA and DEFAULT_PROJECT_ID are dynamically replaced during standalone HTML export.
         * DEFAULT_DATA e DEFAULT_PROJECT_ID vengono popolati dinamicamente durante l'esportazione HTML.
         */
        const DEFAULT_DATA = [];
        const DEFAULT_PROJECT_NAME = "Nuovo Progetto";
        const DEFAULT_PROJECT_ID = "proj_default";

        // Demo Sample Data (3-level WBS hierarchy) / Dati di esempio dimostrativi (Gerarchia WBS a 3 livelli)
        const SAMPLE_DATA = [
            {
                id: "parent-1",
                title: "1. Fase di Progettazione & UX",
                isParent: true,
                expanded: true,
                color: "#4f46e5",
                bgOpacity: 12,
                children: [
                    {
                        id: "child-1-1",
                        title: "1.1 Analisi & Requisiti",
                        expanded: true,
                        startDate: "2026-10-05",
                        endDate: "2026-10-16",
                        delayDays: 0,
                        progress: 100,
                        delayReason: "",
                        children: [
                            { id: "subchild-1-1-1", title: "Interviste Stakeholder", startDate: "2026-10-05", endDate: "2026-10-09", delayDays: 0, progress: 100, delayReason: "" },
                            { id: "subchild-1-1-2", title: "Stesura Documento Requisiti", startDate: "2026-10-10", endDate: "2026-10-16", delayDays: 0, progress: 100, delayReason: "" }
                        ]
                    },
                    {
                        id: "child-1-2",
                        title: "1.2 Wireframe e Prototipazione",
                        expanded: true,
                        startDate: "2026-10-12",
                        endDate: "2026-10-21",
                        delayDays: 4,
                        progress: 50,
                        delayReason: "Attesa feedback cliente",
                        children: [
                            { id: "subchild-1-2-1", title: "Bozza Layout Figma", startDate: "2026-10-12", endDate: "2026-10-18", delayDays: 2, progress: 80, delayReason: "Revisione interna" },
                            { id: "subchild-1-2-2", title: "Test di Usabilità UX", startDate: "2026-10-19", endDate: "2026-10-21", delayDays: 2, progress: 20, delayReason: "Ritardo partecipanti" }
                        ]
                    }
                ]
            },
            {
                id: "parent-2",
                title: "2. Sviluppo Frontend & Backend",
                isParent: true,
                expanded: true,
                color: "#059669",
                bgOpacity: 15,
                children: [
                    {
                        id: "child-2-1",
                        title: "2.1 Architettura Database",
                        expanded: true,
                        startDate: "2026-10-19",
                        endDate: "2026-11-04",
                        delayDays: 0,
                        progress: 60,
                        delayReason: "",
                        children: [
                            { id: "subchild-2-1-1", title: "Modellazione Schema SQL", startDate: "2026-10-19", endDate: "2026-10-26", delayDays: 0, progress: 100, delayReason: "" },
                            { id: "subchild-2-1-2", title: "Script Migrazione Dati", startDate: "2026-10-27", endDate: "2026-11-04", delayDays: 0, progress: 20, delayReason: "" }
                        ]
                    }
                ]
            }
        ];

        let ganttData = [];
        let currentProjectName = DEFAULT_PROJECT_NAME;
        let currentProjectId = DEFAULT_PROJECT_ID;
        let weeksHeader = [];
        let projectStartDate = null;
        let projectEndDate = null;
        let pendingDeleteId = null;
        let pendingDeleteLevel = 1;
        let searchQuery = "";
		let isEditMode = localStorage.getItem('gantt_edit_mode') === 'true';

        // UI Layout Configuration / Configurazione layout interfaccia
        let leftColWidth = parseInt(localStorage.getItem('gantt_left_col_width_v1'), 10) || 600;
        let dayWidth = parseFloat(localStorage.getItem('gantt_day_width_v1')) || 22;
        const WEEK_DAYS = 7;

        // Initialization Listener / Avvio applicazione al caricamento del DOM
        window.addEventListener('DOMContentLoaded', () => {
            loadGanttData();
            setupEventListeners();
            setupColumnResizer();
			applyEditModeUI();
            lucide.createIcons();
            renderGantt();
        });

        /**
         * Load data from localStorage using project ID isolation.
         * Carica i dati dal localStorage isolando il contesto tramite l'ID del progetto.
         */
        function loadGanttData() {
            if (typeof DEFAULT_PROJECT_ID !== 'undefined' && DEFAULT_PROJECT_ID) {
                currentProjectId = DEFAULT_PROJECT_ID;
            } else {
                currentProjectId = "proj_" + Date.now();
            }

            const storageKey = 'gantt_chart_data_' + currentProjectId;
            const stored = localStorage.getItem(storageKey);

            if (stored) {
                try {
                    ganttData = JSON.parse(stored);
                } catch (e) {
                    ganttData = Array.isArray(DEFAULT_DATA) ? JSON.parse(JSON.stringify(DEFAULT_DATA)) : [];
                }
            } else if (Array.isArray(DEFAULT_DATA) && DEFAULT_DATA.length > 0) {
                ganttData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveGanttData();
            } else {
                ganttData = [];
            }

            const storedName = localStorage.getItem('gantt_project_name_' + currentProjectId);
            if (storedName) {
                currentProjectName = storedName;
            } else if (typeof DEFAULT_PROJECT_NAME !== 'undefined' && DEFAULT_PROJECT_NAME) {
                currentProjectName = DEFAULT_PROJECT_NAME;
            }

            updateProjectNameUI();
            calculateRollups();
        }

        /**
         * Save current state to localStorage.
         * Salva lo stato corrente nel localStorage.
         */
        function saveGanttData() {
            localStorage.setItem('gantt_chart_data_' + currentProjectId, JSON.stringify(ganttData));
            localStorage.setItem('gantt_project_name_' + currentProjectId, currentProjectName);
        }

		function applyEditModeUI() {
			const btnText = document.getElementById('toggleEditText');
			const btnIcon = document.getElementById('toggleEditIcon');

			if (isEditMode) {
				document.body.classList.remove('view-mode');
				if (btnText) btnText.innerText = "Modalità Modifica";
				if (btnIcon) {
					btnIcon.setAttribute('data-lucide', 'pencil');
					btnIcon.className = "w-4 h-4 text-amber-600";
				}
			} else {
				document.body.classList.add('view-mode');
				if (btnText) btnText.innerText = "Modalità Vista";
				if (btnIcon) {
					btnIcon.setAttribute('data-lucide', 'eye');
					btnIcon.className = "w-4 h-4 text-indigo-600";
				}
			}
			lucide.createIcons();
		}

		function toggleEditMode() {
			isEditMode = !isEditMode;
			localStorage.setItem('gantt_edit_mode', isEditMode);
			applyEditModeUI();
		}
		
        function updateProjectNameUI() {
            document.getElementById('projectNameDisplay').innerText = currentProjectName;
			document.title = currentProjectName; // <-- Aggiorna l'etichetta della scheda del browser
        }

        function editProjectName() {
            const newName = prompt("Inserisci il nome del Progetto / Enter project name:", currentProjectName);
            if (newName !== null && newName.trim() !== "") {
                currentProjectName = newName.trim();
                updateProjectNameUI();
                saveGanttData();
            }
        }

        /**
         * Calculate task duration in effective working days (including delays).
         * Calcola la durata in giorni effettivi di lavoro (inclusi eventuali ritardi).
         */
        function getTaskDurationDays(startDateStr, endDateStr, delayDays = 0) {
            if (!startDateStr || !endDateStr) return 1;
            const start = new Date(startDateStr);
            const baseEnd = new Date(endDateStr);
            const diffTime = Math.max(0, baseEnd - start);
            const baseDays = Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
            return baseDays + (parseInt(delayDays) || 0);
        }

        /**
         * Automatic 3-level cascading recalculation with WEIGHTED PROGRESS based on days duration.
         * Ricalcolo automatico a cascata a 3 livelli con AVANZAMENTO PONDERATO basato sulla durata in giorni.
         */
        function calculateRollups() {
            ganttData.forEach(parent => {
                if (!parent.children || parent.children.length === 0) {
                    parent.startDate = "";
                    parent.endDate = "";
                    parent.plannedEndDate = "";
                    parent.progress = 0;
                    return;
                }

                let parentMinStart = null;
                let parentMaxPlannedEnd = null;
                let parentMaxEffectiveEnd = null;
                
                let parentTotalWeightedProgressDays = 0;
                let parentTotalDurationDays = 0;

                parent.children.forEach(child => {
                    if (child.children && child.children.length > 0) {
                        let childMinStart = null;
                        let childMaxPlannedEnd = null;
                        let childMaxEffectiveEnd = null;
                        
                        let childTotalWeightedProgressDays = 0;
                        let childTotalDurationDays = 0;

                        child.children.forEach(subchild => {
                            const subStart = new Date(subchild.startDate);
                            const subBaseEnd = new Date(subchild.endDate);
                            const subEffectiveEnd = addDays(subBaseEnd, subchild.delayDays || 0);

                            if (!childMinStart || subStart < childMinStart) childMinStart = subStart;
                            if (!childMaxPlannedEnd || subBaseEnd > childMaxPlannedEnd) childMaxPlannedEnd = subBaseEnd;
                            if (!childMaxEffectiveEnd || subEffectiveEnd > childMaxEffectiveEnd) childMaxEffectiveEnd = subEffectiveEnd;

                            const subDuration = getTaskDurationDays(subchild.startDate, subchild.endDate, subchild.delayDays);
                            const subProgress = parseInt(subchild.progress) || 0;
                            
                            childTotalWeightedProgressDays += subDuration * (subProgress / 100);
                            childTotalDurationDays += subDuration;
                        });

                        child.startDate = childMinStart ? formatDateToISO(childMinStart) : "";
                        child.plannedEndDate = childMaxPlannedEnd ? formatDateToISO(childMaxPlannedEnd) : "";
                        child.endDate = childMaxEffectiveEnd ? formatDateToISO(childMaxEffectiveEnd) : "";
                        
                        child.progress = childTotalDurationDays > 0 
                            ? Math.round((childTotalWeightedProgressDays / childTotalDurationDays) * 100) 
                            : 0;

                        if (childMaxPlannedEnd && childMaxEffectiveEnd) {
                            const diff = Math.round((childMaxEffectiveEnd - childMaxPlannedEnd) / (1000 * 60 * 60 * 24));
                            child.delayDays = Math.max(0, diff);
                        }
                    }

                    if (child.startDate) {
                        const cStart = new Date(child.startDate);
                        const cBaseEnd = new Date(child.plannedEndDate || child.endDate);
                        const cEffectiveEnd = addDays(new Date(child.endDate), child.children && child.children.length > 0 ? 0 : (child.delayDays || 0));

                        if (!parentMinStart || cStart < parentMinStart) parentMinStart = cStart;
                        if (!parentMaxPlannedEnd || cBaseEnd > parentMaxPlannedEnd) parentMaxPlannedEnd = cBaseEnd;
                        if (!parentMaxEffectiveEnd || cEffectiveEnd > parentMaxEffectiveEnd) parentMaxEffectiveEnd = cEffectiveEnd;
                    }

                    const childDuration = getTaskDurationDays(child.startDate, child.plannedEndDate || child.endDate, child.delayDays);
                    const childProgress = parseInt(child.progress) || 0;

                    parentTotalWeightedProgressDays += childDuration * (childProgress / 100);
                    parentTotalDurationDays += childDuration;
                });

                parent.startDate = parentMinStart ? formatDateToISO(parentMinStart) : "";
                parent.plannedEndDate = parentMaxPlannedEnd ? formatDateToISO(parentMaxPlannedEnd) : "";
                parent.endDate = parentMaxEffectiveEnd ? formatDateToISO(parentMaxEffectiveEnd) : "";
                
                parent.progress = parentTotalDurationDays > 0 
                    ? Math.round((parentTotalWeightedProgressDays / parentTotalDurationDays) * 100) 
                    : 0;
            });
        }

        /**
         * Calculate timeline date range boundaries (weeks/months).
         * Calcola i confini temporali della timeline principale (settimane/mesi).
         */
        function calculateTimelineRange() {
            let allDates = [];

            ganttData.forEach(parent => {
                if (parent.startDate) allDates.push(new Date(parent.startDate));
                if (parent.endDate) allDates.push(new Date(parent.endDate));

                parent.children.forEach(child => {
                    if (child.startDate) allDates.push(new Date(child.startDate));
                    if (child.endDate) {
                        allDates.push(new Date(child.endDate));
                        const effEnd = addDays(new Date(child.endDate), child.delayDays || 0);
                        allDates.push(effEnd);
                    }

                    if (child.children) {
                        child.children.forEach(subchild => {
                            if (subchild.startDate) allDates.push(new Date(subchild.startDate));
                            if (subchild.endDate) {
                                allDates.push(new Date(subchild.endDate));
                                const subEffEnd = addDays(new Date(subchild.endDate), subchild.delayDays || 0);
                                allDates.push(subEffEnd);
                            }
                        });
                    }
                });
            });

            if (allDates.length === 0) {
                const today = new Date();
                allDates.push(today);
                allDates.push(addDays(today, 30));
            }

            let minDate = new Date(Math.min(...allDates));
            let maxDate = new Date(Math.max(...allDates));

            minDate = getMonday(minDate);
            maxDate = addDays(getMonday(maxDate), 14);

            projectStartDate = minDate;
            projectEndDate = maxDate;

            weeksHeader = [];
            let curr = new Date(projectStartDate);

            while (curr < projectEndDate) {
                const weekEnd = addDays(curr, 6);
                const weekNum = getWeekNumber(curr);
                
                weeksHeader.push({
                    label: `Sett. ${weekNum}`,
                    rangeText: `${formatShortDate(curr)} - ${formatShortDate(weekEnd)}`,
                    startDate: new Date(curr),
                    endDate: weekEnd
                });

                curr = addDays(curr, 7);
            }
        }

        /**
         * Generate background grid lines (dotted days, solid weeks) and today column highlight.
         * Genera le linee di sfondo della griglia (giorni puntati, settimane continue) ed evidenzia il giorno corrente.
         */
        function createBackgroundGridHtml() {
            let html = '';
            let totalDays = weeksHeader.length * WEEK_DAYS;
            
            const today = new Date();
            const todayNormalized = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const startNormalized = new Date(projectStartDate.getFullYear(), projectStartDate.getMonth(), projectStartDate.getDate());
            const diffDaysToday = Math.round((todayNormalized - startNormalized) / (1000 * 60 * 60 * 24));

            for (let d = 0; d < totalDays; d++) {
                const leftPos = d * dayWidth;
                
                if (d === diffDaysToday) {
                    html += `<div class="today-column-bg" style="left: ${leftPos}px; width: ${dayWidth}px;" title="Oggi / Today"></div>`;
                }

                if (d === diffDaysToday || d === diffDaysToday + 1) {
                    html += `<div class="today-dotted-line" style="left: ${leftPos}px;" title="Oggi / Today"></div>`;
                } else if (d > 0 && d % WEEK_DAYS === 0) {
                    html += `<div class="week-grid-line" style="left: ${leftPos}px;"></div>`;
                } else if (d > 0) {
                    html += `<div class="day-grid-line" style="left: ${leftPos}px;"></div>`;
                }
            }
            return html;
        }

        /**
         * Main rendering engine for the 3-level WBS Gantt table.
         * Motore di rendering principale per la tabella Gantt WBS a 3 livelli.
         */
        function renderGantt() {
            calculateRollups();
            calculateTimelineRange();

            const headerRow = document.getElementById('ganttHeaderRow');
            headerRow.innerHTML = `
                <th id="leftHeaderCol" class="sticky-col-header bg-slate-100 p-3 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]" style="width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;">
                    <div class="flex items-center justify-between pr-2">
                        <span>Struttura Attività (WBS)</span>
                        <span class="text-[10px] text-slate-400 font-normal">Livelli 1 - 2 - 3</span>
                    </div>
                    <div id="columnResizer" class="resizer-handle" title="Trascina per regolare la larghezza / Drag to resize column"></div>
                </th>
            `;

            setupColumnResizer();

            const colWidth = dayWidth * WEEK_DAYS;

            weeksHeader.forEach(week => {
                const th = document.createElement('th');
                th.className = "p-2 border-r border-slate-200 text-center font-medium relative timeline-col-header bg-slate-100";
                th.style.cssText = `width: ${colWidth}px; min-width: ${colWidth}px; max-width: ${colWidth}px;`;
                th.innerHTML = `
                    <div class="text-xs font-bold text-slate-700">${week.label}</div>
                    <div class="text-[10px] text-slate-400 font-normal">${week.rangeText}</div>
                    <div class="timeline-resizer-handle" title="Ridimensiona zoom / Resize zoom"></div>
                `;
                headerRow.appendChild(th);
            });

            setupTimelineResizer();

            const tbody = document.getElementById('ganttBody');
            tbody.innerHTML = "";

            const query = searchQuery ? searchQuery.toLowerCase().trim() : "";

            // Filter data structure based on search query / Filtra la struttura dati in base alla ricerca
            const filteredData = ganttData.map(parent => {
                const parentMatches = parent.title.toLowerCase().includes(query);
                
                const filteredChildren = parent.children ? parent.children.map(child => {
                    const childMatches = child.title.toLowerCase().includes(query);
                    
                    const filteredSubchildren = child.children ? child.children.filter(sub => {
                        return sub.title.toLowerCase().includes(query);
                    }) : [];

                    const subMatches = filteredSubchildren.length > 0;

                    if (parentMatches || childMatches || subMatches) {
                        return {
                            ...child,
                            children: (parentMatches || childMatches) ? (child.children || []) : filteredSubchildren
                        };
                    }
                    return null;
                }).filter(Boolean) : [];

                const childrenMatch = filteredChildren.length > 0;

                if (parentMatches || childrenMatch) {
                    return {
                        ...parent,
                        children: parentMatches ? (parent.children || []) : filteredChildren
                    };
                }
                return null;
            }).filter(Boolean);

            if (filteredData.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="${weeksHeader.length + 1}" class="text-center py-12 text-slate-400">
                        <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                        <p class="text-sm font-medium">Nessuna attività corrisponde alla ricerca. / No matching tasks found.</p>
                    </td>
                `;
                tbody.appendChild(emptyRow);
                lucide.createIcons();
                return;
            }

            filteredData.forEach((parent, parentIdx) => {
                const hexColor = parent.color || "#4f46e5";
                const opacityVal = (parent.bgOpacity || 15) / 100;
                const solidBg = getSolidTint(hexColor, opacityVal);

                const parentDateStr = (parent.startDate && parent.endDate) ? `${formatShortDate(new Date(parent.startDate))} - ${formatShortDate(new Date(parent.endDate))}` : '';

                // --- LEVEL 1: PARENT ROW / Riga Gruppo Principale ---
                const parentRow = document.createElement('tr');
                parentRow.className = "hover:brightness-95 transition-all group border-b border-slate-200/80";

                const sidebarCell = document.createElement('td');
                sidebarCell.className = "sticky-col px-2.5 py-1.5 font-semibold text-slate-800 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]";
                sidebarCell.style.cssText = `background-color: ${solidBg}; border-top: 4px solid ${hexColor}; width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;`;
                sidebarCell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 overflow-hidden mr-2">
                            <button onclick="toggleExpand('${parent.id}', 1)" class="text-slate-500 hover:text-slate-800 p-1 rounded">
                                <i data-lucide="${parent.expanded ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4"></i>
                            </button>
                            <span class="truncate text-sm font-semibold" title="${escapeHtml(parent.title)}">${escapeHtml(parent.title)}</span>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <!-- Date and Progress / Date e Avanzamento -->
                            <div class="text-right flex flex-col justify-center">
                                <span class="text-[10px] text-slate-500 font-medium leading-tight">${parentDateStr}</span>
                                <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-white/70 text-slate-700 border border-slate-200/50" title="Avanzamento Ponderato / Weighted Progress">${parent.progress}%</span>
                            </div>
                            <div class="action-buttons flex items-center space-x-1 border-l border-slate-200/60 pl-2">
                                <button onclick="moveParent('${parent.id}', 'up')" ${parentIdx === 0 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-600"'} title="Sposta Su / Move Up">
                                    <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="moveParent('${parent.id}', 'down')" ${parentIdx === filteredData.length - 1 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-600"'} title="Sposta Giù / Move Down">
                                    <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="duplicateParent('${parent.id}')" class="p-1 hover:bg-indigo-100 text-indigo-600 rounded" title="Duplica Gruppo e Sotto-attività / Duplicate Group & Subtasks">
                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="addChildTask('${parent.id}')" class="p-1 hover:bg-indigo-100 text-indigo-600 rounded" title="Aggiungi Sotto-attività (Livello 2) / Add Child">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                                <button onclick="openEditModal('${parent.id}', 1)" class="p-1 hover:bg-slate-200/60 rounded text-slate-600" title="Modifica Gruppo / Edit">
                                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="promptDelete('${parent.id}', 1)" class="p-1 hover:bg-red-100 text-red-600 rounded" title="Elimina / Delete">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                parentRow.appendChild(sidebarCell);

                const timelineCell = document.createElement('td');
                timelineCell.colSpan = weeksHeader.length;
                timelineCell.className = "p-0 relative h-12";
                timelineCell.style.cssText = `background-color: ${solidBg}; border-top: 4px solid ${hexColor};`;

                timelineCell.innerHTML = createBackgroundGridHtml();

                if (parent.startDate && parent.endDate) {
                    const plannedEnd = parent.plannedEndDate || parent.endDate;
                    const hasParentDelay = new Date(parent.endDate) > new Date(plannedEnd);

                    const basePos = calculateBarPosition(parent.startDate, plannedEnd);

                    let delayBarHtml = '';
                    if (hasParentDelay) {
                        const effectivePos = calculateBarPosition(parent.startDate, parent.endDate);
                        const delayWidth = effectivePos.width - basePos.width;
                        const delayLeft = basePos.left + basePos.width;

                        const plannedEndDateObj = new Date(plannedEnd);
                        const effectiveEndDateObj = new Date(parent.endDate);
                        const parentDelayDays = Math.round((effectiveEndDateObj - plannedEndDateObj) / (1000 * 60 * 60 * 24));

                        delayBarHtml = `
                            <div class="absolute h-6 top-2.5 rounded-r-md bg-amber-500 border-t border-b border-r border-amber-600 flex items-center justify-center shadow-sm cursor-pointer group/delay z-10"
                                 style="left: ${delayLeft}px; width: ${delayWidth}px;"
                                 data-delay-info="Ritardo complessivo gruppo / Group total delay: +${parentDelayDays} giorni. Fine effettiva / Effective end: ${formatShortDate(effectiveEndDateObj)}">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-white"></i>
                            </div>
                        `;
                    }

                    const parentBar = document.createElement('div');
                    parentBar.className = "absolute h-6 top-2.5 rounded-md shadow-sm border-2 border-slate-900/40 overflow-hidden flex items-center z-10";
                    
                    if (hasParentDelay) {
                        parentBar.style.cssText = `left: ${basePos.left}px; width: ${basePos.width}px; background-color: ${hexColor}; border-top-right-radius: 0; border-bottom-right-radius: 0;`;
                    } else {
                        parentBar.style.cssText = `left: ${basePos.left}px; width: ${basePos.width}px; background-color: ${hexColor};`;
                    }

                    parentBar.innerHTML = `
                        <div class="h-full bg-black/20" style="width: ${parent.progress}%;"></div>
                        <span class="absolute inset-0 flex items-center justify-center text-[11px] font-bold text-white drop-shadow-sm px-2 truncate">
                            ${parent.progress}% (${formatShortDate(new Date(parent.startDate))} - ${formatShortDate(new Date(parent.endDate))})
                        </span>
                    `;

                    timelineCell.appendChild(parentBar);
                    if (hasParentDelay) {
                        timelineCell.insertAdjacentHTML('beforeend', delayBarHtml);
                    }
                }

                parentRow.appendChild(timelineCell);
                tbody.appendChild(parentRow);

                // --- LEVEL 2: CHILD ROWS / Sotto-attività ---
                if ((parent.expanded || query) && parent.children) {
                    parent.children.forEach((child, childIdx) => {
                        const hasSubchildren = child.children && child.children.length > 0;
                        const childRow = document.createElement('tr');
                        childRow.className = "hover:brightness-95 transition-all border-b border-slate-100";

                        const hasDelay = (child.delayDays || 0) > 0;
                        const delayDays = child.delayDays || 0;

                        const childSidebar = document.createElement('td');
                        childSidebar.className = "sticky-col p-2 pl-6 text-xs font-semibold text-slate-700 border-r border-slate-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]";
                        childSidebar.style.cssText = `background-color: ${solidBg}; width: ${leftColWidth}px; min-width: ${leftColWidth}px; max-width: ${leftColWidth}px;`;
                        childSidebar.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                                    <button onclick="toggleExpand('${child.id}', 2)" class="text-slate-500 hover:text-slate-800 p-0.5 rounded ${hasSubchildren ? '' : 'invisible'}">
                                        <i data-lucide="${child.expanded !== false ? 'chevron-down' : 'chevron-right'}" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <i data-lucide="corner-down-right" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                    <span class="truncate font-medium" title="${escapeHtml(child.title)}">${escapeHtml(child.title)}</span>
                                    ${hasDelay ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 shrink-0" title="Ritardo / Delay: +${delayDays}g"><i data-lucide="alert-triangle" class="w-3 h-3 mr-0.5 text-amber-600"></i>+${delayDays}g</span>` : ''}
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <!-- Date and Progress / Date e Avanzamento -->
                                    <div class="text-right flex flex-col justify-center">
                                        <span class="text-[9px] text-slate-400 font-medium leading-tight">${child.startDate ? formatShortDate(new Date(child.startDate)) : ''} - ${child.endDate ? formatShortDate(new Date(child.endDate)) : ''}</span>
                                        <span class="text-[10px] text-slate-500 font-semibold">${child.progress}%</span>
                                    </div>
                                    <div class="action-buttons flex items-center space-x-1 border-l border-slate-200/60 pl-2">
                                        <button onclick="moveChild('${parent.id}', '${child.id}', 'up')" ${childIdx === 0 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-500"'} title="Sposta Su / Up">
                                            <i data-lucide="arrow-up" class="w-3 h-3"></i>
                                        </button>
                                        <button onclick="moveChild('${parent.id}', '${child.id}', 'down')" ${childIdx === parent.children.length - 1 ? 'disabled class="opacity-30 text-slate-400"' : 'class="p-1 hover:bg-slate-200/60 rounded text-slate-500"'} title="Sposta Giù / Down">
