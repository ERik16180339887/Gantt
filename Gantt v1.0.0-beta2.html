        /**
         * Setup left sidebar column resizing logic via mouse drag.
         * Configura il ridimensionamento della colonna sinistra tramite trascinamento mouse.
         */
        function setupColumnResizer() {
            const resizer = document.getElementById('columnResizer');
            if (!resizer) return;

            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = leftColWidth;
                resizer.classList.add('resizing');
                document.body.style.cursor = 'col-resize';

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            const onMouseMove = (e) => {
                if (!isResizing) return;
                const dx = e.clientX - startX;
                const newWidth = Math.max(280, Math.min(1000, startWidth + dx));
                leftColWidth = newWidth;

                document.querySelectorAll('.sticky-col, .sticky-col-header').forEach(el => {
                    el.style.width = `${newWidth}px`;
                    el.style.minWidth = `${newWidth}px`;
                    el.style.maxWidth = `${newWidth}px`;
                });
            };

            const onMouseUp = () => {
                if (!isResizing) return;
                isResizing = false;
                resizer.classList.remove('resizing');
                document.body.style.cursor = 'default';

                localStorage.setItem('gantt_left_col_width_v1', leftColWidth);

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };
        }

        /**
         * Setup timeline day-width scaling (zoom) via drag handles.
         * Configura lo zoom orizzontale dei giorni nella timeline tramite trascinamento.
         */
        function setupTimelineResizer() {
            const resizers = document.querySelectorAll('.timeline-resizer-handle');
            resizers.forEach(resizer => {
                let isResizing = false;
                let startX = 0;
                let startDayWidth = 0;

                resizer.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    isResizing = true;
                    startX = e.clientX;
                    startDayWidth = dayWidth;
                    resizer.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';

                    const onMouseMove = (moveEvent) => {
                        if (!isResizing) return;
                        const dx = moveEvent.clientX - startX;
                        const dayDelta = dx / WEEK_DAYS;
                        const newDayWidth = Math.max(8, Math.min(60, startDayWidth + dayDelta));
                        dayWidth = newDayWidth;
                        renderGantt();
                    };

                    const onMouseUp = () => {
                        if (!isResizing) return;
                        isResizing = false;
                        resizer.classList.remove('resizing');
                        document.body.style.cursor = 'default';

                        localStorage.setItem('gantt_day_width_v1', dayWidth);

                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        /**
         * Tooltip hover management for delays.
         * Gestisce i tooltip informativi in hover per i ritardi.
         */
        function setupTooltips() {
            const tooltip = document.getElementById('customTooltip');
            const delayElements = document.querySelectorAll('[data-delay-info]');

            delayElements.forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    const info = el.getAttribute('data-delay-info');
                    tooltip.innerHTML = `
                        <div class="font-bold text-amber-400 mb-1 flex items-center"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 mr-1"></i> Segnalazione Ritardo / Delay Info</div>
                        <div>${info.replace(/\. /g, '<br>')}</div>
                    `;
                    tooltip.classList.remove('hidden');
                    lucide.createIcons();
                });

                el.addEventListener('mousemove', (e) => {
                    tooltip.style.left = (e.clientX + 12) + 'px';
                    tooltip.style.top = (e.clientY + 12) + 'px';
                });

                el.addEventListener('mouseleave', () => {
                    tooltip.classList.add('hidden');
                });
            });
        }

        /**
         * Calculate pixel left and width for timeline task bars.
         * Calcola posizione pixel (left) e larghezza (width) per le barre sulla timeline.
         */
        function calculateBarPosition(startDateStr, endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);

            const diffStartDays = Math.max(0, Math.round((start - projectStartDate) / (1000 * 60 * 60 * 24)));
            const durationDays = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1);

            return {
                left: diffStartDays * dayWidth,
                width: durationDays * dayWidth
            };
        }

        /**
         * Attach drag and resize events to task bars.
         * Associa gli eventi di trascinamento e ridimensionamento orizzontale alle barre delle attività.
         */
        function attachDragEvents(barElem, taskItem, level, parentId, childId) {
            let isDragging = false;
            let isResizingLeft = false;
            let isResizingRight = false;
            let startX = 0;
            let initialLeft = 0;
            let initialWidth = 0;

            const onMouseDown = (e) => {
                const handle = e.target.getAttribute('data-handle');
                if (handle === 'left') {
                    isResizingLeft = true;
                } else if (handle === 'right') {
                    isResizingRight = true;
                } else {
                    isDragging = true;
                }

                startX = e.clientX;
                initialLeft = parseFloat(barElem.style.left) || 0;
                initialWidth = parseFloat(barElem.style.width) || dayWidth;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;

                const dx = e.clientX - startX;
                const daysDelta = Math.round(dx / dayWidth);

                if (isDragging) {
                    const newLeft = Math.max(0, initialLeft + (daysDelta * dayWidth));
                    barElem.style.left = `${newLeft}px`;
                } else if (isResizingRight) {
                    const newWidth = Math.max(dayWidth, initialWidth + (daysDelta * dayWidth));
                    barElem.style.width = `${newWidth}px`;
                } else if (isResizingLeft) {
                    const maxLeftShift = initialWidth / dayWidth - 1;
                    const clampedDays = Math.min(daysDelta, maxLeftShift);
                    const newLeft = Math.max(0, initialLeft + (clampedDays * dayWidth));
                    const newWidth = Math.max(dayWidth, initialWidth - (clampedDays * dayWidth));
                    barElem.style.left = `${newLeft}px`;
                    barElem.style.width = `${newWidth}px`;
                }
            };

            const onMouseUp = (e) => {
                if (!isDragging && !isResizingLeft && !isResizingRight) return;

                const finalLeft = parseFloat(barElem.style.left);
                const finalWidth = parseFloat(barElem.style.width);

                const startDaysOffset = Math.round(finalLeft / dayWidth);
                const durationDays = Math.round(finalWidth / dayWidth);

                const newStart = addDays(projectStartDate, startDaysOffset);
                const newEnd = addDays(newStart, durationDays - 1);

                taskItem.startDate = formatDateToISO(newStart);
                taskItem.endDate = formatDateToISO(newEnd);

                isDragging = false;
                isResizingLeft = false;
                isResizingRight = false;

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);

                saveGanttData();
                renderGantt();
            };

            barElem.addEventListener('mousedown', onMouseDown);
        }

        // --- DUPLICATION / DUPLICAZIONE ATTIVITÀ E STRUTTURE (DEEP COPY) ---

        function duplicateParent(parentId) {
            const parentIdx = ganttData.findIndex(p => p.id === parentId);
            if (parentIdx === -1) return;

            const original = ganttData[parentIdx];
            const clonedParent = JSON.parse(JSON.stringify(original));

            clonedParent.id = 'parent-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clonedParent.title = `${original.title} (Copia)`;

            if (clonedParent.children) {
                clonedParent.children.forEach(c => {
                    c.id = 'child-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                    if (c.children) {
                        c.children.forEach(s => {
                            s.id = 'subchild-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                        });
                    }
                });
            }

            ganttData.splice(parentIdx + 1, 0, clonedParent);
            saveGanttData();
            renderGantt();
        }

        function duplicateChild(parentId, childId) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent || !parent.children) return;

            const childIdx = parent.children.findIndex(c => c.id === childId);
            if (childIdx === -1) return;

            const original = parent.children[childIdx];
            const clonedChild = JSON.parse(JSON.stringify(original));

            clonedChild.id = 'child-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clonedChild.title = `${original.title} (Copia)`;

            if (clonedChild.children) {
                clonedChild.children.forEach(s => {
                    s.id = 'subchild-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                });
            }

            parent.children.splice(childIdx + 1, 0, clonedChild);
            saveGanttData();
            renderGantt();
        }

        function duplicateSubchild(parentId, childId, subchildId) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent || !parent.children) return;

            const child = parent.children.find(c => c.id === childId);
            if (!child || !child.children) return;

            const subIdx = child.children.findIndex(s => s.id === subchildId);
            if (subIdx === -1) return;

            const original = child.children[subIdx];
            const clonedSub = JSON.parse(JSON.stringify(original));

            clonedSub.id = 'subchild-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clonedSub.title = `${original.title} (Copia)`;

            child.children.splice(subIdx + 1, 0, clonedSub);
            saveGanttData();
            renderGantt();
        }

        // --- HIERARCHY & CRUD FUNCTIONS / Funzioni di gestione gerarchia e CRUD ---

        function toggleExpand(id, level) {
            if (level === 1) {
                const parent = ganttData.find(p => p.id === id);
                if (parent) parent.expanded = !parent.expanded;
            } else if (level === 2) {
                ganttData.forEach(p => {
                    const child = p.children ? p.children.find(c => c.id === id) : null;
                    if (child) child.expanded = (child.expanded === false) ? true : false;
                });
            }
            saveGanttData();
            renderGantt();
        }

        function moveParent(parentId, direction) {
            const idx = ganttData.findIndex(p => p.id === parentId);
            if (idx === -1) return;

            if (direction === 'up' && idx > 0) {
                const temp = ganttData[idx];
                ganttData[idx] = ganttData[idx - 1];
                ganttData[idx - 1] = temp;
            } else if (direction === 'down' && idx < ganttData.length - 1) {
                const temp = ganttData[idx];
                ganttData[idx] = ganttData[idx + 1];
                ganttData[idx + 1] = temp;
            }

            saveGanttData();
            renderGantt();
        }

        function moveChild(parentId, childId, direction) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent || !parent.children) return;

            const idx = parent.children.findIndex(c => c.id === childId);
            if (idx === -1) return;

            if (direction === 'up' && idx > 0) {
                const temp = parent.children[idx];
                parent.children[idx] = parent.children[idx - 1];
                parent.children[idx - 1] = temp;
            } else if (direction === 'down' && idx < parent.children.length - 1) {
                const temp = parent.children[idx];
                parent.children[idx] = parent.children[idx + 1];
                parent.children[idx + 1] = temp;
            }

            saveGanttData();
            renderGantt();
        }

        function moveSubchild(parentId, childId, subchildId, direction) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent || !parent.children) return;

            const child = parent.children.find(c => c.id === childId);
            if (!child || !child.children) return;

            const idx = child.children.findIndex(s => s.id === subchildId);
            if (idx === -1) return;

            if (direction === 'up' && idx > 0) {
                const temp = child.children[idx];
                child.children[idx] = child.children[idx - 1];
                child.children[idx - 1] = temp;
            } else if (direction === 'down' && idx < child.children.length - 1) {
                const temp = child.children[idx];
                child.children[idx] = child.children[idx + 1];
                child.children[idx + 1] = temp;
            }

            saveGanttData();
            renderGantt();
        }

        function addChildTask(parentId) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent) return;

            const today = new Date();
            const nextWeek = addDays(today, 7);
            const isoDate = formatDateToISO(today);
            const isoNextWeek = formatDateToISO(nextWeek);

            const newChild = {
                id: 'child-' + Date.now(),
                title: 'Nuova Sotto-attività / New Child',
                expanded: true,
                startDate: isoDate,
                endDate: isoNextWeek,
                delayDays: 0,
                progress: 0,
                delayReason: "",
                children: []
            };

            if (!parent.children) parent.children = [];
            parent.children.push(newChild);
            parent.expanded = true;

            saveGanttData();
            renderGantt();
            openEditModal(newChild.id, 2);
        }

        function addSubchildTask(parentId, childId) {
            const parent = ganttData.find(p => p.id === parentId);
            if (!parent || !parent.children) return;

            const child = parent.children.find(c => c.id === childId);
            if (!child) return;

            const today = new Date();
            const nextWeek = addDays(today, 5);
            const isoDate = formatDateToISO(today);
            const isoNextWeek = formatDateToISO(nextWeek);

            const newSubchild = {
                id: 'subchild-' + Date.now(),
                title: 'Nuova Sotto-sotto-attività / New Subchild',
                startDate: isoDate,
                endDate: isoNextWeek,
                delayDays: 0,
                progress: 0,
                delayReason: ""
            };

            if (!child.children) child.children = [];
            child.children.push(newSubchild);
            child.expanded = true;

            saveGanttData();
            renderGantt();
            openEditModal(newSubchild.id, 3);
        }

        document.getElementById('addParentBtn').addEventListener('click', () => {
            const newParent = {
                id: 'parent-' + Date.now(),
                title: 'Nuovo Gruppo / New Parent Group',
                isParent: true,
                expanded: true,
                color: '#2563eb',
                bgOpacity: 15,
                children: []
            };

            ganttData.push(newParent);
            saveGanttData();
            renderGantt();
            openEditModal(newParent.id, 1);
        });

        function openEditModal(id, level) {
            const modal = document.getElementById('editModal');
            document.getElementById('editTaskId').value = id;
            document.getElementById('editTaskLevel').value = level;

            if (level === 1) {
                const parent = ganttData.find(p => p.id === id);
                if (!parent) return;

                document.getElementById('modalTitle').innerText = "Modifica Gruppo Genitore (Livello 1)";
                document.getElementById('editTaskTitle').value = parent.title;
                document.getElementById('dateInputsGroup').classList.add('hidden');
                document.getElementById('delayDaysGroup').classList.add('hidden');
                document.getElementById('progressInputGroup').classList.add('hidden');
                document.getElementById('colorPickerGroup').classList.remove('hidden');

                document.getElementById('editColorHex').value = parent.color || "#4f46e5";
                document.getElementById('editOpacity').value = parent.bgOpacity || 15;
                document.getElementById('opacityValue').innerText = `${parent.bgOpacity || 15}%`;

            } else {
                let targetTask = null;

                ganttData.forEach(p => {
                    if (level === 2) {
                        const found = p.children ? p.children.find(c => c.id === id) : null;
                        if (found) targetTask = found;
                    } else if (level === 3) {
                        if (p.children) {
                            p.children.forEach(c => {
                                const foundSub = c.children ? c.children.find(s => s.id === id) : null;
                                if (foundSub) targetTask = foundSub;
                            });
                        }
                    }
                });

                if (!targetTask) return;

                document.getElementById('modalTitle').innerText = level === 2 ? "Modifica Sotto-attività (Livello 2)" : "Modifica Sotto-sotto-attività (Livello 3)";
                document.getElementById('editTaskTitle').value = targetTask.title;
                document.getElementById('dateInputsGroup').classList.remove('hidden');
                document.getElementById('delayDaysGroup').classList.remove('hidden');
                document.getElementById('progressInputGroup').classList.remove('hidden');
                document.getElementById('colorPickerGroup').classList.add('hidden');

                document.getElementById('editStartDate').value = targetTask.startDate || "";
                document.getElementById('editEndDate').value = targetTask.endDate || "";
                document.getElementById('editDelayDays').value = targetTask.delayDays || 0;
                document.getElementById('editDelayReason').value = targetTask.delayReason || "";
                document.getElementById('editProgress').value = targetTask.progress || 0;
                document.getElementById('progressValue').innerText = `${targetTask.progress || 0}%`;
            }

            modal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function setPresetColor(colorHex) {
            document.getElementById('editColorHex').value = colorHex;
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editTaskId').value;
            const level = parseInt(document.getElementById('editTaskLevel').value, 10);
            const title = document.getElementById('editTaskTitle').value;

            if (level === 1) {
                const parent = ganttData.find(p => p.id === id);
                if (parent) {
                    parent.title = title;
                    parent.color = document.getElementById('editColorHex').value;
                    parent.bgOpacity = parseInt(document.getElementById('editOpacity').value, 10);
                }
            } else {
                ganttData.forEach(p => {
                    if (level === 2 && p.children) {
                        const child = p.children.find(c => c.id === id);
                        if (child) {
                            child.title = title;
                            child.startDate = document.getElementById('editStartDate').value;
                            child.endDate = document.getElementById('editEndDate').value;
                            child.delayDays = parseInt(document.getElementById('editDelayDays').value, 10) || 0;
                            child.delayReason = document.getElementById('editDelayReason').value;
                            child.progress = parseInt(document.getElementById('editProgress').value, 10);
                        }
                    } else if (level === 3 && p.children) {
                        p.children.forEach(c => {
                            if (c.children) {
                                const subchild = c.children.find(s => s.id === id);
                                if (subchild) {
                                    subchild.title = title;
                                    subchild.startDate = document.getElementById('editStartDate').value;
                                    subchild.endDate = document.getElementById('editEndDate').value;
                                    subchild.delayDays = parseInt(document.getElementById('editDelayDays').value, 10) || 0;
                                    subchild.delayReason = document.getElementById('editDelayReason').value;
                                    subchild.progress = parseInt(document.getElementById('editProgress').value, 10);
                                }
                            }
                        });
                    }
                });
            }

            saveGanttData();
            renderGantt();
            closeEditModal();
        });

        document.getElementById('editOpacity').addEventListener('input', (e) => {
            document.getElementById('opacityValue').innerText = `${e.target.value}%`;
        });

        document.getElementById('editProgress').addEventListener('input', (e) => {
            document.getElementById('progressValue').innerText = `${e.target.value}%`;
        });

        function promptDelete(id, level) {
            pendingDeleteId = id;
            pendingDeleteLevel = level;

            const messageElem = document.getElementById('deleteModalMessage');
            if (level === 1) {
                messageElem.innerText = "Sei sicuro di voler eliminare questo gruppo e tutte le sotto-attività collegate? / Delete parent and all its children?";
            } else if (level === 2) {
                messageElem.innerText = "Sei sicuro di voler eliminare questa sotto-attività e le sotto-sotto-attività? / Delete child and subchildren?";
            } else {
                messageElem.innerText = "Sei sicuro di voler eliminare questa sotto-sotto-attività? / Delete subchild?";
            }

            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            pendingDeleteId = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (!pendingDeleteId) return;

            if (pendingDeleteLevel === 1) {
                ganttData = ganttData.filter(p => p.id !== pendingDeleteId);
            } else if (pendingDeleteLevel === 2) {
                ganttData.forEach(p => {
                    if (p.children) p.children = p.children.filter(c => c.id !== pendingDeleteId);
                });
            } else if (pendingDeleteLevel === 3) {
                ganttData.forEach(p => {
                    if (p.children) {
                        p.children.forEach(c => {
                            if (c.children) c.children = c.children.filter(s => s.id !== pendingDeleteId);
                        });
                    }
                });
            }

            saveGanttData();
            renderGantt();
            closeDeleteModal();
        });

                customName = customName.trim() || defaultFileName;
                if (!customName.endsWith('.json')) {

                }

                    projectName: currentProjectName,
                    data: ganttData
                };

                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", customName);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            // JSON file import (Fixed: handles both new structured objects and legacy arrays) / Importazione JSON con supporto retrocompatibilità
            document.getElementById('importInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed)) {
                            ganttData = parsed;
                        } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.data)) {
                            ganttData = parsed.data;
                            if (parsed.projectName) {
                                currentProjectName = parsed.projectName;
                                updateProjectNameUI();
                            }
                        }
                        saveGanttData();
                        renderGantt();
                    } catch (err) {
                        console.error("Invalid JSON file / File JSON non valido");
                    }
                };
                reader.readAsText(file);
            });

            document.getElementById('clearBtn').addEventListener('click', () => {

                renderGantt();

            document.getElementById('resetBtn').addEventListener('click', () => {

                    ganttData = JSON.parse(JSON.stringify(DEFAULT_DATA));

                } else {
                    ganttData = JSON.parse(JSON.stringify(SAMPLE_DATA));
                    currentProjectName = "Progetto Esempio UX/UI";
                }
                updateProjectNameUI();
                saveGanttData();
                renderGantt();
            });
        }

        // --- UTILITY FUNCTIONS / FUNZIONI DI UTILITÀ ---

        function formatDateToISO(date) {
            return date.toISOString().split('T')[0];
        }

        function formatShortDate(date) {
            const d = date.getDate().toString().padStart(2, '0');
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            return `${d}/${m}`;
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function getWeekNumber(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        /**
         * Blend a hex color with white based on given opacity for row backgrounds.
         * Miscela un colore esadecimale con il bianco in base all'opacità per lo sfondo delle righe.
         */
        function getSolidTint(hex, opacity) {
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            
            const nr = Math.round(r * opacity + 255 * (1 - opacity));
            const ng = Math.round(g * opacity + 255 * (1 - opacity));
            const nb = Math.round(b * opacity + 255 * (1 - opacity));
            
            return `#${((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1)}`;
        }

        function escapeHtml(str) {
            return str.replace(/&amp;|&lt;|&gt;|&quot;|&#039;/g, function(m) {
                return {
                    '&amp;': '&',
                    '&lt;': '<',
                    '&gt;': '>',
                    '&quot;': '"',
                    '&#039;': "'"
                }[m];
            }).replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
